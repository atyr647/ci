# The portal backends for the Ribbon session (XDG_CURRENT_DESKTOP=Ribbon:wlroots). xdg-desktop-portal finds this
# file through XDG_CONFIG_DIRS (/usr/share/ribbon/xdg, set by ribbon-session and passed to D-Bus activation by the
# labwc autostart). Screen sharing and screenshots come from wlr; file pickers from Ribbon's own chooser
# (appearance/chooser-portal.tcl, share/xdg-desktop-portal/portals/ribbon.portal), gtk's while Ribbon's is not
# installed; the Settings portal (the color-scheme, theme, icons and font ribbon-theme writes to GSettings) from gtk;
# anything else from the first of the two that has it.
[preferred]
default=wlr;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.FileChooser=ribbon;gtk
org.freedesktop.impl.portal.Settings=gtk
