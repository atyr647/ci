<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Ribbon's font names (installed as /etc/fonts/conf.d/30-ribbon-fonts.conf;
  see /usr/lib/ribbon/shell/text.tcl). Tk asks fontconfig for every
  "normal" font at weight 100, which is Medium (500), so text meant to be
  Inter Regular came out Medium, wider and heavier than the mockups, and
  it can't ask for 600 at all. These family names carry the weight.
-->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>Ribbon Inter 400</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>regular</const></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Ribbon Inter 500</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Ribbon Inter 600</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>semibold</const></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Ribbon Inter 700</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <!-- Space Grotesk ships as a variable font without a 600 instance;
       ribbon-desktop adds one (SpaceGrotesk-SemiBold.ttf, made at build
       time), under the family name "Space Grotesk SemiBold" -->
  <match target="pattern">
    <test qual="any" name="family"><string>Ribbon Space Grotesk 600</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Space Grotesk SemiBold</string><string>Space Grotesk</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>semibold</const></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Ribbon Space Grotesk 700</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Space Grotesk</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <!-- Ribbon Mono is the one monospace token (the terminal, the editor, the
       Colours and Properties previews): JetBrains Mono. Ribbon Mono Bold is
       its bold face, for the places that need one. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Ribbon Mono</string></test>
    <edit name="family" mode="assign" binding="strong"><string>JetBrains Mono</string><string>monospace</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>regular</const></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Ribbon Mono Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>JetBrains Mono</string><string>monospace</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
</fontconfig>
