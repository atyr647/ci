#!/usr/sbin/nft -f
# Ribbon's firewall (nftables, in place of ufw, with its defaults: deny incoming, allow outgoing). Installed as
# /usr/share/ribbon/nftables.conf and copied to /etc/nftables.conf at install time, which the nftables service
# loads at boot (nft -f).
# Incoming: denied, except replies to connections this machine opened, loopback, and the ICMP and ICMPv6 that IPv4
# and IPv6 need to work (neighbour discovery, path MTU, errors, ping) and DHCPv6 replies. Outgoing: open.
# Forwarding is not filtered here: the kernel does not forward unless a tool (a VM or container manager) turns it
# on, and those bring their own rules. Only Ribbon's table is replaced when this is loaded again; other tables stay.
table inet ribbon
delete table inet ribbon

table inet ribbon {
	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif "lo" accept

		# IPv4: errors (unreachable, needs-fragmentation, time exceeded, bad header) and ping, rate-limited
		ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
		ip protocol icmp icmp type echo-request limit rate 10/second accept

		# IPv6: neighbour and router discovery (link-local only, hop limit 255, as RFC 4861 requires), multicast
		# listener queries, path MTU, errors, ping
		meta l4proto ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
		meta l4proto ipv6-icmp icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, nd-redirect } ip6 hoplimit 255 accept
		meta l4proto ipv6-icmp icmpv6 type { mld-listener-query, mld2-listener-report } ip6 saddr fe80::/10 accept
		meta l4proto ipv6-icmp icmpv6 type echo-request limit rate 10/second accept

		# DHCPv6: the server's replies to this machine's client (sent to a multicast address, so not "established")
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
	}
}
