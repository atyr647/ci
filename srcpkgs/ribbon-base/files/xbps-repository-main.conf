# Ribbon OS repositories. Order matters: the first repository that has a
# package wins (bestmatching=false), so Ribbon's overlay comes first.
#
# @RIBBON_REPO@ is Ribbon's own package repository; @RIBBON_CHANNEL@ is the
# Void mirror that installed systems update from. With a hosted Ribbon update
# channel it points at the tested, ~1 week delayed snapshot (docs/UPDATES.md);
# by default it is Void's own mirror.
repository=@RIBBON_REPO@
repository=@RIBBON_CHANNEL@
repository=@RIBBON_CHANNEL@/nonfree
repository=@RIBBON_CHANNEL@/multilib
repository=@RIBBON_CHANNEL@/multilib/nonfree
