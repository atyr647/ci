# /etc/ribbon/ribbon.conf - system-wide Ribbon OS settings.

# Take a snapshot before every update made through `ribbon update`
# (the bar's and Settings' updates too). (yes|no)
SNAPSHOT_BEFORE_UPDATE=yes

# How many automatic pre-update snapshots to keep.
SNAPSHOT_KEEP=10

# Disk space kept for the system (ribbon-reserve), so a download that fills
# the disk can't take the OS down. Your files can't use the last
# RESERVE_SIZE; RESERVE_SPARE of it sits in a spare file that is deleted
# automatically if the system itself runs out, then made again later.
# 15G covers a large update (kernel, firmware, Mesa, NVIDIA: about 4 GB
# downloaded and 4 GB unpacked), the snapshot that keeps the old versions,
# and room to log in and clean up. Check with: ribbon reserve status
RESERVE_SIZE=15G
RESERVE_SPARE=2G
