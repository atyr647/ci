# Ribbon OS package policy (shipped by ribbon-base, do not edit; override in
# /etc/xbps.d/ with a file of the same name).

# Ribbon replaces runit-void with ribbon-dinit and base-system with
# ribbon-base; never let a dependency pull the runit init back in.
ignorepkg=runit-void
ignorepkg=base-system
virtualpkg=runit-void:ribbon-dinit

# Ribbon follows fixed LTS kernel series (ribbon-kernel); don't let the
# rolling "linux" metapackage install a newer non-LTS series behind its back.
ignorepkg=linux
ignorepkg=linux-headers

# The first repository that has a package wins (Ribbon's overlay repository
# is listed first), instead of the highest version across all repositories.
bestmatching=false
