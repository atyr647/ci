# Ribbon OS gaming sysctl defaults (/usr/lib/sysctl.d; override in /etc/sysctl.d)

# Star Citizen (and other big Wine/Proton games) map huge numbers of memory
# regions; the LUG recommends 16777216. Harmless for everything else.
vm.max_map_count = 16777216

# Plenty of file handles for esync/fsync-heavy games and launchers.
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Don't penalise games that do split locks (some Unreal/Proton titles stutter
# badly with the kernel's split-lock mitigation; see split_lock_detect=off).
kernel.split_lock_mitigate = 0

# Keep the desktop responsive under memory pressure and avoid stalls when
# large amounts of dirty data (shader caches, game installs) are written.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.compaction_proactiveness = 0
vm.min_free_kbytes = 131072
