; Ribbon OS GameMode defaults (/usr/share/gamemode/gamemode.ini is upstream's;
; this is installed as /etc/gamemode.ini; yours: ~/.config/gamemode.ini)
[general]
renice=10
ioprio=0
inhibit_screensaver=1
softrealtime=auto

[cpu]
park_cores=no
pin_cores=no

[gpu]
; Leave GPU clocks alone by default; set apply_gpu_optimisations=accept-responsibility to tune.
apply_gpu_optimisations=0

[custom]
; Switch the sched_ext scheduler to its performance mode while a game runs.
start=/usr/bin/ribbon-scheduler gamemode on
end=/usr/bin/ribbon-scheduler gamemode off
