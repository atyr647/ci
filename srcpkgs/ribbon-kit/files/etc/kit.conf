# /etc/kit.conf -- kit's system-wide settings (docs/KIT-CLI.md)
#
# Repositories are files of their own: /etc/kit/repos.d/<id>.conf (url, mirror and keys lines), one
# per repository, each with its own root-signed key list.  Ribbon's is org.ribbon.main.conf; another
# repository's keys may sign its own app kits, never system kits (docs/KIT-TRUST.md section 6).
#
# mirror = URL       a mirror of Ribbon's repository; repeat the line for more (tried in order, before
#                    those of org.ribbon.main.conf; one that fails or serves anything badly signed is
#                    skipped for the next)
# index = FILE       pin a saved, signed index snapshot instead of refreshing (as KIT_INDEX=FILE):
#                    for reproducible installs, testing and debugging; the background refresh is
#                    off while pinned, and every command says so
# keys = FILE        Ribbon's root-signed key list (docs/KIT-TRUST.md; default: the keys line of
#                    org.ribbon.main.conf, /etc/kit/trusted-keys): the anchor; accepted updates go
#                    to ~/.local/share/kit/keys
# repos = DIR        the repository files (default /etc/kit/repos.d)
# essential = NAME   kits that can't be tossed (besides those whose manifest says x-essential)
# timeout = SECONDS  per network request (default 30)
#
# allow-unsigned = yes   DEVELOPERS ONLY: install unsigned kits and kits signed by keys that are
#                        not trusted.  Every command then prints a warning.  Never on a real system.

essential = org.ribbon.base
