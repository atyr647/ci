# /etc/kit/repos.d/org.ribbon.main.conf -- Ribbon's own kit repository (docs/KIT-TRUST.md section 6)
#
# url = URL       the repository; mirror = URL for each further mirror (tried in order, after the
#                 mirror lines of /etc/kit.conf)
# keys = FILE     its root-signed key list (+ FILE.minisig): the only list whose keys may sign
#                 system kits

keys = /etc/kit/trusted-keys
