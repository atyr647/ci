<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- kitd (org.ribbon.Kit1): only root owns the name; anyone may call it, and kitd asks polkit
     (org.ribbon.kit.system) before it queues a transaction. Installed in /usr/share/dbus-1/system.d. -->
<busconfig>
  <policy user="root">
    <allow own="org.ribbon.Kit1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ribbon.Kit1" send_interface="org.ribbon.Kit1"/>
    <allow send_destination="org.ribbon.Kit1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.ribbon.Kit1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
