# Ribbon OS build configuration.
# Sourced by build/*.sh. Everything here can be overridden from the
# environment, e.g.  RIBBON_ARCH=x86_64 make iso

: "${RIBBON_VERSION:=0.1.0}"
: "${RIBBON_CODENAME:=bowline}"
: "${RIBBON_ARCH:=x86_64}"

# The base the build is for (tests/base.sh; decision 5: Void for the first image). Checks that hold Ribbon to
# one base's packaging (srcpkgs templates, runit compatibility, Void's package names) run only for that base.
: "${RIBBON_BASE:=void}"

# Upstream Void repositories (glibc). The ISO build talks to these directly;
# installed systems talk to the Ribbon update channel (see docs/UPDATES.md).
: "${VOID_MIRROR:=https://repo-default.voidlinux.org}"
: "${VOID_PACKAGES_GIT:=https://github.com/void-linux/void-packages.git}"
: "${VOID_MKLIVE_GIT:=https://github.com/void-linux/void-mklive.git}"

# Where Ribbon's own binary packages end up (xbps-src hostdir/binpkgs).
: "${RIBBON_REPO_DIR:=$PWD/out/repo}"

# Default kernel series. 6.18 is an LTS series. Ribbon's own ribbon-kernel (6.18, build/ci/kernel.yml) is the
# default boot entry; Void's linux6.18 stays installed as the fallback entry in the boot menu. RIBBON_KERNEL is the
# Void kernel package the live image boots when the repository holds no ribbon-kernel (build/build-iso.sh).
: "${RIBBON_KERNEL:=linux6.18}"
: "${RIBBON_KERNEL_FALLBACK:=linux6.18}"

# Default sched_ext scheduler (falls back to the kernel's EEVDF scheduler
# automatically if it ever exits or crashes).
: "${RIBBON_SCHEDULER:=scx_lavd}"

: "${RIBBON_ISO_TITLE:=Ribbon OS ${RIBBON_VERSION}}"
: "${RIBBON_ISO_NAME:=ribbon-${RIBBON_VERSION}-${RIBBON_ARCH}}"

# Bundle NVIDIA (595/580/470) + Broadcom Wi-Fi drivers on the ISO for
# offline installs (adds roughly 1 GB). yes|no
: "${RIBBON_OFFLINE_DRIVERS:=yes}"
