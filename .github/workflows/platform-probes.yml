name: platform-probes
# (1) Executable memory from a Cosmopolitan program on each OS (needed by any JIT or ahead-of-time code loader inside the one file).
# (2) Distribution trust, what CI can measure: Windows Defender's verdict on Cosmopolitan outputs, macOS Gatekeeper/quarantine behaviour, file sizes and compression.
on:
  workflow_dispatch:
    inputs:
      cosmo_run: { description: 'optional dawn-cosmo run id, to also check its fat Dawn executable (artifact wgt-dawn)', required: false, default: '' }
env: { COSMOCC: 4.0.2 }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o cosmocc.zip https://github.com/jart/cosmopolitan/releases/download/$COSMOCC/cosmocc-$COSMOCC.zip && mkdir cosmo && unzip -q cosmocc.zip -d cosmo
          mkdir out; cosmo/bin/cosmocc -O2 platform-probes/jit_probe.c -o out/jit-probe.com; cosmo/bin/cosmocc -O2 platform-probes/hello.c -o out/hello.com
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: probes, path: out }
  sign-ossl:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: probes, path: out }
      - name: Sign the file with osslsigncode (Linux tool, self-signed certificate)
        continue-on-error: true
        run: |
          sudo apt-get install -y osslsigncode >/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -keyout k.pem -out c.pem -days 2 -subj '/CN=Test Signing' -addext 'extendedKeyUsage=codeSigning' 2>/dev/null
          mkdir ossl; cp out/hello.com ossl/hello.exe
          echo "--- osslsigncode on the file as built:"; osslsigncode sign -certs c.pem -key k.pem -h sha256 -in ossl/hello.exe -out ossl/hello-ossl-signed.exe 2>&1 | tail -3; echo "exit: ${PIPESTATUS[0]}"
          echo "--- PE header with 16 data directories (second copy of the header in padding):"
          python3 platform-probes/pe_prepare_for_signing.py out/hello.com ossl/hello-p.exe
          osslsigncode sign -certs c.pem -key k.pem -h sha256 -in ossl/hello-p.exe -out ossl/hello-p-ossl-signed.exe 2>&1 | tail -3; echo "exit: ${PIPESTATUS[0]}"
          chmod +x ossl/hello-p.exe; sh ossl/hello-p.exe && echo "prepared file still runs on Linux"
          [ -f ossl/hello-p-ossl-signed.exe ] && { chmod +x ossl/hello-p-ossl-signed.exe; sh ossl/hello-p-ossl-signed.exe && echo "signed file still runs on Linux (via sh)"; osslsigncode verify -in ossl/hello-p-ossl-signed.exe 2>&1 | tail -4; }
          rm ossl/hello.exe; ls -la ossl
      - uses: actions/upload-artifact@v4
        with: { name: ossl, path: ossl, if-no-files-found: warn }
  run:
    needs: [build, sign-ossl]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,   os: ubuntu-latest }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
          - { label: win-x64,     os: windows-latest }
          - { label: win-arm64,   os: windows-11-arm }
          - { label: mac-arm64,   os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: probes, path: out }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: ossl, path: ossl }
      - name: Optional - the fat Dawn executable of a dawn-cosmo run
        if: inputs.cosmo_run != ''
        run: gh run download ${{ inputs.cosmo_run }} -R ${{ github.repository }} -n wgt-dawn -D out
      - name: Executable memory
        run: |
          cd out; chmod +x *.com
          if [ "$RUNNER_OS" = Windows ]; then cp jit-probe.com jit-probe.exe; ./jit-probe.exe; else sh ./jit-probe.com; fi
      - name: Windows Defender verdict (the runner's Defender, signatures as of today; an EICAR test file is the control that proves the scanner works)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          Get-MpComputerStatus | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          "scanner: $mp"
          New-Item -ItemType Directory -Force scan | Out-Null
          # the standard antivirus test string (harmless by design) - built in two pieces so this workflow file itself is not flagged
          $e1 = 'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-'; $e2 = 'ANTIVIRUS-TEST-FILE!$H+H*'
          [IO.File]::WriteAllText("$PWD\scan\eicar.txt", $e1 + $e2)
          Copy-Item out\hello.com scan\hello.exe; Copy-Item out\jit-probe.com scan\jit-probe.exe
          Get-ChildItem out\*.com | ForEach-Object { Copy-Item $_.FullName ("scan\" + $_.BaseName + ".exe") -Force }
          foreach ($f in Get-ChildItem scan) {
            $out = & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation 2>&1 | Out-String
            "== $($f.Name) ($($f.Length) bytes): MpCmdRun exit $LASTEXITCODE"
            ($out -split "`n" | Where-Object { $_ -match 'found|threat|Threat|error|Error|0x' } | Select-Object -First 4) -join "`n"
          }
          "--- Start-MpScan on the folder, then the detections Defender recorded:"
          try { Start-MpScan -ScanType CustomScan -ScanPath "$PWD\scan" -ErrorAction Stop } catch { "Start-MpScan: $($_.Exception.Message)" }
          Get-MpThreatDetection | Select-Object ThreatID, Resources | Format-List
          Get-MpThreat | Select-Object ThreatName, SeverityID | Format-List
      - name: macOS Gatekeeper and quarantine
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cd out; sw_vers | head -3; cp hello.com hello-q.com
          echo "--- signature of the file as built:"; codesign -dv hello.com 2>&1 | head -3 || true
          echo "--- spctl assessment (what Gatekeeper says about an unsigned executable):"; spctl --assess --type execute -vv hello.com 2>&1 || true
          xattr -w com.apple.quarantine "0083;$(printf '%x' $(date +%s));Safari;$(uuidgen)" hello-q.com
          echo "--- quarantined copy, attributes:"; xattr -l hello-q.com
          echo "--- spctl on the quarantined copy:"; spctl --assess --type execute -vv hello-q.com 2>&1 || true
          echo "--- running the quarantined copy from a shell (no GUI prompt possible in CI):"; chmod +x hello-q.com; ./hello-q.com; echo "exit: $?"
          echo "--- direct execution of the unquarantined file:"; chmod +x hello.com; ./hello.com; echo "exit: $?"
          echo "--- what the first run left behind in the home directory:"; ls -la ~ | grep -i ape || true; ls -la ~/.ape* 2>/dev/null || true
      - name: Windows - can the file be Authenticode-signed and still run? (self-signed certificate; SmartScreen reputation itself cannot be tested in CI)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: |
          cd out
          Copy-Item hello.com signed.exe
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Test Signing" -CertStoreLocation Cert:\CurrentUser\My
          $r = Set-AuthenticodeSignature -FilePath signed.exe -Certificate $cert -HashAlgorithm SHA256
          "sign status: $($r.Status) / $($r.StatusMessage)"
          $v = Get-AuthenticodeSignature signed.exe; "verify: $($v.Status) (UnknownError/NotTrusted is expected for a self-signed root); signer: $($v.SignerCertificate.Subject)"
          ./signed.exe; "run after signing, exit: $LASTEXITCODE"
          "--- the file with a 16-directory PE header (platform-probes/pe_prepare_for_signing.py):"
          if (Test-Path ..\ossl\hello-p.exe) {
            Copy-Item ..\ossl\hello-p.exe prep.exe; ./prep.exe; "prepared, unsigned, runs on Windows: exit $LASTEXITCODE"
            Copy-Item prep.exe prep-ms.exe; $r3 = Set-AuthenticodeSignature -FilePath prep-ms.exe -Certificate $cert -HashAlgorithm SHA256; "Set-AuthenticodeSignature on prepared file: $($r3.Status) / $($r3.StatusMessage)"
            $v3 = Get-AuthenticodeSignature prep-ms.exe; "  verify: $($v3.Status), signer $($v3.SignerCertificate.Subject)"; ./prep-ms.exe; "  signed by PowerShell, run: exit $LASTEXITCODE"
            $pw = ConvertTo-SecureString -String "pw" -Force -AsPlainText; Export-PfxCertificate -Cert $cert -FilePath test.pfx -Password $pw | Out-Null
            $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1
            if ($st) { Copy-Item prep.exe prep-st.exe; & $st.FullName sign /f test.pfx /p pw /fd SHA256 prep-st.exe 2>&1 | Select-Object -Last 2; "  signtool exit: $LASTEXITCODE"; ./prep-st.exe; "  signed by signtool, run: exit $LASTEXITCODE" }
          }
          if (Test-Path ..\ossl\hello-p-ossl-signed.exe) { Copy-Item ..\ossl\hello-p-ossl-signed.exe prep-ossl.exe; $v2 = Get-AuthenticodeSignature prep-ossl.exe; "osslsigncode-signed prepared file: $($v2.Status), signer $($v2.SignerCertificate.Subject)"; ./prep-ossl.exe; "  run: exit $LASTEXITCODE" }
          (Get-Item hello.com).Length; (Get-Item signed.exe).Length
          # does the zip directory (Cosmopolitan's embedded read-only file system) still resolve after the signature was appended?
          "--- hello.com file listing as a zip, before and after:"
          try { Add-Type -AssemblyName System.IO.Compression.FileSystem; foreach ($f in 'hello.com','signed.exe') { try { $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $f)); "$f : zip entries = $($z.Entries.Count)"; $z.Dispose() } catch { "$f : not readable as zip ($($_.Exception.Message))" } } } catch { "zip check skipped" }
      - name: macOS - ad-hoc code signature on the file
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cd out; cp hello.com hello-signed.com
          codesign --force -s - hello-signed.com 2>&1 | head -5; echo "codesign exit: $?"
          codesign -dv hello-signed.com 2>&1 | head -5 || true
          chmod +x hello-signed.com; ./hello-signed.com; echo "run after signing, exit: $?"
          sh ./hello-signed.com; echo "via sh, exit: $?"
      - name: Sizes and compression
        run: |
          cd out; for f in *.com; do s=$(wc -c < $f); z=$(gzip -9 -c $f | wc -c); x=$(xz -6 -c $f 2>/dev/null | wc -c); echo "$f: $s bytes, gzip -9: $z, xz -6: ${x:-n/a}"; done
