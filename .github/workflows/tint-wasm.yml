name: tint-wasm
# Spike: can Dawn's shader compiler (Tint: WGSL -> SPIR-V / HLSL / MSL) be compiled to a WebAssembly module and run by Wasmtime, so shader translation lives
# inside the sandbox and is byte-identical on every OS? (The GPU backends cannot: wasm cannot call Vulkan/D3D12/Metal.)
on:
  workflow_dispatch:
env:
  DAWN_SHA: 106704a9ac3fc21b1580ea85aea302ac17d416f1
  WT: v50.0.0
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz | tar xz
          ls -d wasi-sdk-34*; ls wasi-sdk-34*/share/cmake
          curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/$WT/wasmtime-$WT-x86_64-linux.tar.xz | tar xJ
      - name: Fetch Dawn
        run: |
          mkdir dawn && cd dawn && git init -q && git remote add origin https://github.com/google/dawn.git
          git fetch -q --depth 1 origin $DAWN_SHA && git checkout -q FETCH_HEAD
      - name: Teach Dawn's platform detection that WASI is POSIX
        run: |
          sed -i 's/^#elif defined(__linux__)$/#elif defined(__linux__) || defined(__wasi__)/' dawn/src/utils/platform.h
          grep -n "__wasi__" dawn/src/utils/platform.h
          # outside a browser the wasm 'debugger' statement does not exist: trap instead
          sed -i 's/#define DAWN_DETAIL_TRAP() EM_ASM(debugger;);/#define DAWN_DETAIL_TRAP() __builtin_trap();/' dawn/src/utils/force_crash.h
          grep -n "__builtin_trap" dawn/src/utils/force_crash.h
      - name: Configure for wasm32-wasip1 (only Tint's command-line tool)
        run: |
          S=$PWD/$(ls -d wasi-sdk-34*)
          tc=$S/share/cmake/wasi-sdk-p1.cmake; [ -f $tc ] || tc=$S/share/cmake/wasi-sdk.cmake
          cmake -S dawn -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$tc -DWASI_SDK_PREFIX=$S -DCMAKE_BUILD_TYPE=Release \
            -DDAWN_FETCH_DEPENDENCIES=ON -DDAWN_ENABLE_VULKAN=OFF -DDAWN_ENABLE_D3D12=OFF -DDAWN_ENABLE_D3D11=OFF -DDAWN_ENABLE_METAL=OFF \
            -DDAWN_ENABLE_DESKTOP_GL=OFF -DDAWN_ENABLE_OPENGLES=OFF -DDAWN_ENABLE_NULL=ON -DDAWN_USE_X11=OFF -DDAWN_USE_WAYLAND=OFF -DDAWN_USE_GLFW=OFF \
            -DDAWN_BUILD_SAMPLES=OFF -DDAWN_BUILD_TESTS=OFF -DDAWN_BUILD_BENCHMARKS=OFF -DDAWN_BUILD_PROTOBUF=OFF -DDAWN_ENABLE_INSTALL=OFF \
            -DTINT_BUILD_TESTS=OFF -DTINT_BUILD_CMD_TOOLS=ON -DTINT_BUILD_HLSL_WRITER=ON -DTINT_BUILD_MSL_WRITER=ON -DTINT_BUILD_SPV_WRITER=ON \
            -DTINT_BUILD_SPV_READER=OFF -DTINT_BUILD_GLSL_WRITER=OFF -DTINT_BUILD_GLSL_VALIDATOR=OFF -DTINT_BUILD_WGSL_READER=ON -DTINT_BUILD_WGSL_WRITER=ON \
            -DDAWN_WERROR=OFF -DCMAKE_CXX_FLAGS="-D_WASI_EMULATED_PROCESS_CLOCKS -D_WASI_EMULATED_SIGNAL -D_WASI_EMULATED_MMAN" \
            -DCMAKE_EXE_LINKER_FLAGS="-lwasi-emulated-process-clocks -lwasi-emulated-signal -lwasi-emulated-mman" 2>&1 | tee configure.log | tail -30
      - name: Build tint.wasm (keep going to collect every error)
        run: |
          cmake --build build --target tint_cmd_tint_cmd -- -k 0 > build.log 2>&1 || true
          echo '=== failed objects'; grep 'FAILED:' build.log | cut -c1-200 | head -30
          echo '=== distinct errors'; grep -E 'error:|undefined (reference|symbol)' build.log | sed -E 's#/home/runner/work/ci/ci/dawn/##' | cut -c1-230 | sort | uniq -c | sort -rn | head -30
          tail -3 build.log
          find build -name 'tint*' -type f \( -name '*.wasm' -o -perm -u+x \) -size +100k -exec ls -la {} \;
      - name: Run it under Wasmtime - the same WGSL to three targets
        continue-on-error: true
        run: |
          w=$(find build -name 'tint*' -type f -size +100k ! -name '*.a' ! -name '*.o' | head -1); echo "tool: $w"; ls -la "$w"
          cat > t.wgsl <<'WGSL'
          @group(0) @binding(0) var<storage, read_write> data : array<u32>;
          @compute @workgroup_size(64)
          fn main(@builtin(global_invocation_id) id : vec3<u32>) {
            let i = id.x;
            if (i < arrayLength(&data)) { data[i] = i * i + 7u; }
          }
          WGSL
          sed -i 's/^          //' t.wgsl
          WT=$PWD/wasmtime-$WT-x86_64-linux/wasmtime
          for f in spirv hlsl msl wgsl; do
            echo "=================== --format $f"; /usr/bin/time -f "%es %MKB" $WT run --dir=. "$w" --format $f -o out.$f t.wgsl 2>&1 | tail -5; head -c 700 out.$f 2>/dev/null | cat -v | head -20; echo; wc -c out.$f 2>/dev/null
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: logs, path: "*.log" }
      - uses: actions/upload-artifact@v4
        with: { name: tint-wasm, path: build/tint }
