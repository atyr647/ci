name: swiftshader-cosmo
# Can a software Vulkan implementation (SwiftShader, Reactor with the Subzero JIT backend, no LLVM) be built with Cosmopolitan's compiler and linked into the file? If so, the Linux graphics path needs no glibc at all
# for the software fallback: no dlopen of libvulkan, no foreign calls, no helper (real GPU drivers are glibc programs and would still need one). This job only answers "does it compile": it builds everything it can
# with the cross compiler and reports the objects that fail.
on:
  workflow_dispatch:
    inputs:
      arch: { description: 'x86_64 or aarch64', required: false, default: 'x86_64' }
env: { COSMOCC: 4.0.2 }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env: { COSMO_ARCH: '${{ inputs.arch }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build python3
          curl -fsSL -o cosmocc.zip https://github.com/jart/cosmopolitan/releases/download/$COSMOCC/cosmocc-$COSMOCC.zip && mkdir -p $HOME/cosmo && unzip -q cosmocc.zip -d $HOME/cosmo
          cp $HOME/cosmo/bin/ape-x86_64.elf $HOME/.ape-1.10 && chmod +x $HOME/.ape-1.10
      - name: SwiftShader sources
        run: |
          git clone --depth 1 https://swiftshader.googlesource.com/SwiftShader ss 2>&1 | tail -2
          cd ss && git log -1 --format='%H %cd' && git submodule update --init --depth 1 --recursive -j 8 2>&1 | tail -5; du -sh . third_party/* 2>/dev/null | tail -20
      - name: Configure
        run: |
          emu=""; [ "$COSMO_ARCH" = x86_64 ] && emu="-DCMAKE_CROSSCOMPILING_EMULATOR=$HOME/.ape-1.10"
          cmake -S ss -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/dawn-cosmo/cosmo.cmake -DCMAKE_BUILD_TYPE=Release -DREACTOR_BACKEND=Subzero $emu \
            -DSWIFTSHADER_BUILD_TESTS=OFF -DSWIFTSHADER_BUILD_BENCHMARKS=OFF -DSWIFTSHADER_BUILD_PVR=OFF -DSWIFTSHADER_BUILD_GLESv2=OFF -DSWIFTSHADER_BUILD_EGL=OFF -DSWIFTSHADER_BUILD_GLES_CM=OFF \
            -DSWIFTSHADER_BUILD_VULKAN=ON -DSWIFTSHADER_WARNINGS_AS_ERRORS=OFF \
            "-DCMAKE_C_FLAGS=-D_COSMO_SOURCE -D_GNU_SOURCE -D__linux__=1 -D__unix__=1 -I$PWD/dawn-cosmo/swiftshader-shim -include $PWD/dawn-cosmo/swiftshader-shim/cosmo_compat.h" \
            "-DCMAKE_CXX_FLAGS=-D_COSMO_SOURCE -D_GNU_SOURCE -D__linux__=1 -D__unix__=1 -I$PWD/dawn-cosmo/swiftshader-shim -include $PWD/dawn-cosmo/swiftshader-shim/cosmo_compat.h" \
            -DSWIFTSHADER_BUILD_WSI_XCB=OFF -DSWIFTSHADER_BUILD_WSI_WAYLAND=OFF -DSWIFTSHADER_BUILD_WSI_D2D=OFF -DSWIFTSHADER_ENABLE_ASTC=OFF -DSWIFTSHADER_DCHECK_ALWAYS_ON=OFF 2>&1 | tee configure.log | tail -40
      - name: Build everything that builds (keep going)
        run: |
          cmake --build build --target vk_swiftshader -- -k 0 > build.log 2>&1 || true
          echo "objects built: $(find build -name '*.o' | wc -l)"; echo "=== failed"; grep 'FAILED:' build.log | cut -c1-200 | head -40
          echo "=== distinct errors"; grep -E 'error:|undefined reference' build.log | sed -E 's#/home/runner/work/ci/ci/##' | cut -c1-230 | sort | uniq -c | sort -rn | head -40; tail -3 build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: swiftshader-logs, path: "*.log" }
