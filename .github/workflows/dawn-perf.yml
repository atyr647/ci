name: dawn-perf
# Where does the time go in Dawn compiled by Cosmopolitan versus native Dawn? Flat CPU profiles (perf, software clock) of the same benchmark program, same backend
# (Vulkan on a software GPU), on Linux x86-64 and arm64. The Cosmopolitan side runs the linker's .dbg ELF directly (it carries the symbols that the APE file strips).
on:
  workflow_dispatch:
    inputs:
      cosmo_run: { description: 'run id of a dawn-cosmo run that uploaded the artifact dbg-dawn-bench', required: true }
      flags_run: { description: 'optional: run id of a dawn-flags run; its bench-clang-<arch> artifact (Dawn built by the Cosmopolitan clang) is profiled as well', required: false, default: '' }
      mode: { description: 'tint = shader-module loop, buffer = buffer create/release loop', required: false, default: 'tint' }
env:
  DAWN_SHA: 106704a9ac3fc21b1580ea85aea302ac17d416f1
jobs:
  perf:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,   os: ubuntu-latest,    arch: x86_64 }
          - { label: linux-arm64, os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang mesa-vulkan-drivers libvulkan1 strace
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y linux-tools-azure || sudo apt-get install -y linux-tools-generic || true
          PERF=$(command -v perf || ls /usr/lib/linux-tools/*/perf | tail -1); echo "PERF=$PERF" >> "$GITHUB_ENV"; "$PERF" --version || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true
      - name: Restore native Dawn (cache written by the dawn-bench workflow)
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: dawn-native-static-${{ matrix.label }}-${{ env.DAWN_SHA }}-v1
          fail-on-cache-miss: true
      - name: Native benchmark (keeps its symbol table)
        run: |
          cmake -S ci-webgpu-test/bench -B benchout -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/dist" -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-g1"
          cmake --build benchout
      - name: Cosmopolitan benchmark (the .dbg ELF of the link step)
        run: |
          gh run download ${{ inputs.cosmo_run }} -R ${{ github.repository }} -n dbg-dawn-bench -D dbg
          if [ -n "${{ inputs.flags_run }}" ]; then gh run download ${{ inputs.flags_run }} -R ${{ github.repository }} -n bench-clang-${{ matrix.arch }} -D dbg || echo "no clang build"; fi
          ls -la dbg; chmod +x dbg/*
      - name: Hottest instructions of the lexer entry point (mode annotate)
        if: inputs.mode == 'annotate'
        run: |
          export WGT_BACKEND=vulkan BENCH_TINT_REPEAT=300
          N=benchout/dawn-bench; C=dbg/dawn-bench.${{ matrix.arch }}.com.dbg
          for v in native cosmo; do case $v in native) BIN=$N;; *) BIN=$C;; esac
            "$PERF" record -e cpu-clock -F 20000 -o an.$v.data -- $BIN > anrun.$v.txt 2>&1 || echo "record failed $v"
            for SYM in 'tint::wgsl::reader::Lexer::next()' 'tint::wgsl::reader::Lexer::try_hex_float()' 'tint::wgsl::reader::Lexer::try_hex_integer()' 'tint::wgsl::reader::Lexer::try_float()'; do
              F=$(echo "$SYM" | tr -c 'A-Za-z0-9' '_' | cut -c1-40)
              "$PERF" annotate -i an.$v.data --stdio -s "$SYM" 2>/dev/null > anfull.$v.$F.txt || true
              wc -l anfull.$v.$F.txt
              awk "\$1+0 >= 0.6" anfull.$v.$F.txt | head -70 > anhot.$v.$F.txt
            done
          done
          for f in anhot.*.txt; do echo "=== $f"; cut -c1-150 $f; done
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'annotate'
        with:
          name: 'annotate-${{ matrix.label }}'
          path: |
            anhot.*.txt
            anfull.*.txt
            anrun.*.txt
      - name: Page faults of the first 4,000 buffer calls minus start-up, by code location (mode faultprof)
        if: inputs.mode == 'faultprof'
        run: |
          export WGT_BACKEND=vulkan
          N=benchout/dawn-bench; C=dbg/dawn-bench.${{ matrix.arch }}.com.dbg
          for rep in 1 2 3; do for v in native cosmo; do case $v in native) BIN=$N;; *) BIN=$C;; esac
            for K in 1 4000; do
              BENCH_BUFFER_REPEAT=$K "$PERF" record -e page-faults -c 1 -o pf.$v.$K.$rep.data -- $BIN > pfrun.$v.$K.$rep.txt 2>&1 || echo "record failed $v $K"
              "$PERF" report -i pf.$v.$K.$rep.data --stdio --no-children --sort dso,symbol -n 2>/dev/null | grep -v '^#' | grep -v '^$' | head -600 > pftop.$v.$K.$rep.txt || true
            done
          done; done
          grep -h "buffer_plain_minflt\|buffer_create" pfrun.*.4000.1.txt | head
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'faultprof'
        with:
          name: 'faultprof-${{ matrix.label }}'
          path: |
            pftop.*.txt
            pfrun.*.txt
      - name: Profile of the buffer loop minus start-up (mode bufprof)
        if: inputs.mode == 'bufprof'
        run: |
          export WGT_BACKEND=vulkan
          N=benchout/dawn-bench; C=dbg/dawn-bench.${{ matrix.arch }}.com.dbg
          for rep in 1 2 3; do for v in native cosmo; do case $v in native) BIN=$N;; *) BIN=$C;; esac
            for K in 1 200000; do
              BENCH_BUFFER_REPEAT=$K "$PERF" record -e cpu-clock -F 20000 -o pb.$v.$K.$rep.data -- $BIN > pbrun.$v.$K.$rep.txt 2>&1 || echo "record failed $v $K"
              "$PERF" report -i pb.$v.$K.$rep.data --stdio --no-children --sort dso,symbol -n 2>/dev/null | grep -v '^#' | grep -v '^$' | head -400 > pbtop.$v.$K.$rep.txt || true
            done
          done; done
          grep -h "buffer_create" pbrun.*.200000.*.txt | head -12
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'bufprof'
        with:
          name: 'bufprof-${{ matrix.label }}'
          path: |
            pbtop.*.txt
            pbrun.*.txt
      - name: Profile
        if: inputs.mode != 'bufprof' && inputs.mode != 'faultprof' && inputs.mode != 'annotate'
        run: |
          export WGT_BACKEND=vulkan
          N=benchout/dawn-bench; C=dbg/dawn-bench.${{ matrix.arch }}.com.dbg
          if [ "${{ inputs.mode }}" = buffer ]; then export BENCH_BUFFER_REPEAT=${BENCH_N:-800000}; elif [ "${{ inputs.mode }}" = steady ]; then export BENCH_BUFFER_REPEAT=1200000 BENCH_BUFFER_TICK=1; else export BENCH_TINT_REPEAT=400; fi   # only Tint (WGSL parse/validate/translate), or only buffer create/release, in a loop, so the profile is not dominated by the host baselines and the software GPU
          VARS="native cosmo native2 cosmo2"; [ -f dbg/dawn-bench-clang.${{ matrix.arch }}.com.dbg ] && VARS="native cosmo clang native2 cosmo2 clang2"
          for v in $VARS; do
            case $v in native*) BIN=$N;; clang*) BIN=dbg/dawn-bench-clang.${{ matrix.arch }}.com.dbg;; *) BIN=$C;; esac
            "$PERF" record -e cpu-clock -F 20000 -o perf.$v.data -- $BIN > run.$v.txt 2>&1 || { echo "perf record failed for $v"; tail -5 run.$v.txt; }
            "$PERF" report -i perf.$v.data --stdio --no-children --sort dso,symbol -n 2>/dev/null | grep -v '^#' | grep -v '^$' | head -120 > top.$v.txt || true
            "$PERF" report -i perf.$v.data --stdio --no-children --sort symbol 2>/dev/null | grep -v '^#' | grep '\[k\]' | head -40 > ktop.$v.txt || true
            "$PERF" stat -e task-clock,page-faults,context-switches,cpu-migrations -o stat.$v.txt -- $BIN > /dev/null 2>&1 || true
            "$PERF" report -i perf.$v.data --stdio --no-children --sort dso 2>/dev/null | grep -v '^#' | grep -v '^$' | head -12 > dso.$v.txt || true
          done
          # system calls and page faults of the same loop, native against the Cosmopolitan build, and the Cosmopolitan build with the allocator told to keep freed memory (BENCH_MALLOPT)
          for v in native cosmo; do case $v in native) BIN=$N;; *) BIN=$C;; esac
            strace -c -f -o strace.$v.txt $BIN > /dev/null 2>&1 || true
            "$PERF" stat -e page-faults,task-clock -o stat2.$v.txt -- $BIN > /dev/null 2>&1 || true; done
          BENCH_MALLOPT=64 "$PERF" stat -e page-faults,task-clock -o stat2.cosmo-mallopt.txt -- $C > run.cosmo-mallopt.txt 2>&1 || true
          BENCH_MALLOPT=64 strace -c -f -o strace.cosmo-mallopt.txt $C > /dev/null 2>&1 || true
          for v in native cosmo; do echo "=== $v: by object"; cat dso.$v.txt; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'perf-${{ matrix.label }}'
          path: |
            top.*.txt
            dso.*.txt
            run.*.txt
            ktop.*.txt
            stat.*.txt
            stat2.*.txt
            strace.*.txt
      - name: Result (printed last)
        if: always() && inputs.mode != 'bufprof' && inputs.mode != 'faultprof' && inputs.mode != 'annotate'
        run: |
          for v in native cosmo cosmo-mallopt; do echo "=== $v: strace -c (top 8)"; head -12 strace.$v.txt; echo "--- faults"; grep -E "page-faults|task-clock" stat2.$v.txt; done
          VARS=$(ls run.*.txt | sed "s/run\.//;s/\.txt//" | tr "\n" " ")
          for v in $VARS; do echo "=== $v: run"; grep -E "buffer_create|rror|what" run.$v.txt | head -5; tail -3 run.$v.txt; echo "--- by object"; cat dso.$v.txt 2>/dev/null; echo "--- kernel symbols, top 25"; head -25 ktop.$v.txt 2>/dev/null; echo "--- software counters"; grep -E "task-clock|page-faults|context-switches|migrations|elapsed|user|sys" stat.$v.txt 2>/dev/null || true; done
          for v in native cosmo clang; do [ -f top.$v.txt ] || continue; echo "=== $v: flat profile, top 45"; head -45 top.$v.txt; done
