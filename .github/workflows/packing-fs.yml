name: packing-fs
# Compression that costs nothing at start-up: transparent file-system compression applied by an installer after the download (NTFS on Windows, APFS on macOS). The file stays byte-identical to the
# program (the file system decompresses pages when they are read), so signatures and the single-file design are unaffected. Measured: on-disk size and the time of a fresh start of the Dawn test.
on:
  workflow_dispatch:
    inputs:
      cosmo_run: { description: 'dawn-cosmo run whose artifact wgt-dawn holds the fat file', required: true, default: '41082029863' }
      trials: { description: 'trials per variant', required: false, default: '8' }
jobs:
  fs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: win-x64,   os: windows-latest }
          - { label: win-arm64, os: windows-11-arm }
          - { label: mac-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - name: The fat file
        run: gh run download ${{ inputs.cosmo_run }} -R ${{ github.repository }} -n wgt-dawn -D in && ls -la in
      - name: Windows - NTFS compression of an executable (compact /c /exe:...)
        if: runner.os == 'Windows'
        run: |
          set +e; SRC=$PWD/in/wgt-dawn.com
          W=/c/fscomp; mkdir -p $W/t; cp $SRC $W/orig.bin   # the C: drive: the workspace drive of these runners can be ReFS, which has no file compression
          for d in "$PWD" C:; do MSYS_NO_PATHCONV=1 fsutil fsinfo volumeinfo $d 2>&1 | grep -i -E "file system name|supports file-based compression|volume name" | tr '\n' ' '; echo "<- $d"; done
          echo "size of the original: $(stat -c %s $W/orig.bin)"
          run1() { local f=$1; local t0=$(date +%s%N); $W/t/$f > /dev/null 2>&1; local rc=$?; echo "$(( ($(date +%s%N) - t0) / 1000000 )) $rc"; }
          for v in none lzx xpress16k xpress4k none2 none-wait none-rewrite; do : > res.$v; done
          # interleaved: every round runs all variants once, in the same order, after one untimed warm-up start of an uncompressed copy
          cp $W/orig.bin $W/t/warm.exe; $W/t/warm.exe > /dev/null 2>&1
          for i in $(seq 1 ${{ inputs.trials }}); do
            for v in none lzx xpress16k xpress4k none2 none-wait none-rewrite; do
              f=f-$v-$i.exe; cp $W/orig.bin $W/t/$f
              # controls for "was the uncompressed start slow only because the file was run right after it was written (virus scanner on first run)": none-wait runs it 6 s after the copy; none-rewrite rewrites it by compressing then uncompressing it (so it is scanned/touched outside the timing)
              case $v in
                none-wait) sleep 6;;
                none-rewrite) (cd $W/t && MSYS_NO_PATHCONV=1 cmd.exe /c "compact /c /exe:lzx $f && compact /u $f") > compact.$v.txt 2>&1;;
                none*) ;;
                *) (cd $W/t && MSYS_NO_PATHCONV=1 cmd.exe /c "compact /c /exe:$v $f") > compact.$v.txt 2>&1;;
              esac
              run1 $f >> res.$v
            done
          done
          for v in none lzx xpress16k xpress4k none2 none-wait none-rewrite; do
            ms=$(awk '{print $1}' res.$v | sort -n | awk '{a[NR]=$1} END{print a[int((NR+1)/2)]}'); mn=$(awk '{print $1}' res.$v | sort -n | head -1); rcs=$(awk '{print $2}' res.$v | sort -u | tr '\n' ' ')
            echo "variant $v: fresh start median $ms ms, min $mn ms, all: $(awk '{printf "%s ", $1}' res.$v) (exit codes: $rcs); $(grep -i -E 'compressed|ratio' compact.$v.txt 2>/dev/null | tail -2 | tr '\n' ' ')"
          done
          echo "--- compact /q for the last copy of each variant"; for v in lzx xpress16k xpress4k; do (cd $W/t && MSYS_NO_PATHCONV=1 cmd.exe /c "compact /q f-$v-${{ inputs.trials }}.exe") 2>&1 | grep -E "stored in|ratio"; done
      - name: macOS - APFS transparent compression (ditto --hfsCompression)
        if: runner.os == 'macOS'
        run: |
          set +e; SRC=in/wgt-dawn.com; mkdir t; chmod +x $SRC; sh $SRC > /dev/null 2>&1   # primes the loader the file builds on first run
          echo "original: $(stat -f %z $SRC) bytes, blocks on disk: $(ls -ls $SRC | awk '{print $1*512}')"
          run1() { local f=$1; local t0=$(python3 -c 'import time;print(time.time_ns())'); sh ./$f > /dev/null 2>&1; local rc=$?; echo "$(( ($(python3 -c 'import time;print(time.time_ns())') - t0) / 1000000 )) $rc"; }
          for v in none hfs; do
            : > res.$v
            for i in $(seq 1 ${{ inputs.trials }}); do
              f=t/f-$v-$i.com; if [ $v = hfs ]; then ditto --hfsCompression $SRC $f; else cp $SRC $f; fi; chmod +x $f
              run1 $f >> res.$v
            done
            ms=$(awk '{print $1}' res.$v | sort -n | awk '{a[NR]=$1} END{print a[int((NR+1)/2)]}')
            echo "variant $v: fresh start median $ms ms; last copy: $(ls -lsO t/f-$v-1.com | awk '{print "blocks on disk " $1*512 " bytes, flags " $6}')"
          done
      - name: Result (last)
        if: always()
        run: echo done
