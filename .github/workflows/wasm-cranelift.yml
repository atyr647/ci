name: wasm-cranelift
# Which Wasmtime/Cranelift settings make wasm fastest (ISA flags, opt level, bounds checks, instrumentation), and how the wasm source variants compare with native on each platform.
on:
  workflow_dispatch:
env: { WT: v50.0.0 }
jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: wasm builds (wasi-sdk clang)
        run: |
          curl -fsSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz | tar xz
          S=$(ls -d $PWD/wasi-sdk-34*); mkdir out; cd wasm-perf
          C="$S/bin/clang --target=wasm32-wasip1 -O3 -fno-math-errno shootout.c -lm"
          $C -mno-simd128 -DSIMD=0 -o ../out/so-scalar.wasm
          $C -msimd128 -DSIMD=0 -o ../out/so-autovec.wasm
          $C -msimd128 -DSIMD=1 -o ../out/so-simd.wasm
          $C -msimd128 -DSIMD=1 -DUNROLL=2 -o ../out/so-simd-u2.wasm
          $C -msimd128 -DSIMD=1 -DUNROLL=4 -o ../out/so-simd-u4.wasm
          $C -msimd128 -DSIMD=1 -DVB=32 -o ../out/so-simd-vb32.wasm
          $C -msimd128 -DSIMD=1 -DVB=32 -DUNROLL=2 -o ../out/so-simd-vb32-u2.wasm
          $C -msimd128 -mrelaxed-simd -ffp-contract=fast -DSIMD=1 -o ../out/so-relaxed.wasm
          $C -msimd128 -mrelaxed-simd -ffp-contract=fast -DSIMD=1 -DUNROLL=2 -o ../out/so-relaxed-u2.wasm
          ls -la ../out | awk '{print $5, $9}'
      - uses: actions/upload-artifact@v4
        with: { name: so-wasm, path: out }
  run:
    needs: build-wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,   os: ubuntu-latest,    asset: x86_64-linux.tar.xz,   march: "-march=native" }
          - { label: linux-arm64, os: ubuntu-24.04-arm, asset: aarch64-linux.tar.xz,  march: "-mcpu=native" }
          - { label: mac-arm64,   os: macos-latest,     asset: aarch64-macos.tar.xz,  march: "-mcpu=native" }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: so-wasm, path: so }
      - name: Wasmtime CLI
        run: |
          curl -fsSL -o wt.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/$WT/wasmtime-$WT-${{ matrix.asset }}
          mkdir wt && tar xJf wt.tar.xz -C wt; WASMTIME=$PWD/$(find wt -name wasmtime -type f | head -1); echo "WASMTIME=$WASMTIME" >> "$GITHUB_ENV"
          cc --version | head -1
          (grep -m1 'model name\|Model name' /proc/cpuinfo || sysctl -n machdep.cpu.brand_string) 2>/dev/null || true
          (grep -m1 -o 'flags.*\|Features.*' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|fma|bmi2|avx512f|asimd|sve|sve2|asimddp|bf16|i8mm|fphp)$' | tr '\n' ' ') 2>/dev/null || true; echo
          $WASMTIME settings 2>&1 | sed -n '/Settings inferred/,$p' | tr '\n' ' '; echo
      - name: Phase A, Wasmtime settings on the SIMD128 build
        run: |
          python3 wasm-perf/wt_matrix.py "$WASMTIME" so spec-a.json
          python3 wasm-perf/runner.py spec-a.json --rounds 3 --ref 'default (host CPU features)' --kernels matmul256,nbody1024,transform,interp,hash16MB --title "Phase A ${{ matrix.label }}: Wasmtime v50 settings, so-simd.wasm"
      - name: Native builds
        run: |
          mkdir bin; cd wasm-perf; CC=cc; M="${{ matrix.march }}"; F="-O3 -fno-math-errno shootout.c -lm"
          if $CC --version | grep -qi clang; then NOVEC="-fno-vectorize -fno-slp-vectorize"; else NOVEC="-fno-tree-vectorize -fno-tree-slp-vectorize"; fi
          $CC $F -DSIMD=0 -o ../bin/n-scalar
          $CC $F $NOVEC -DSIMD=0 -o ../bin/n-novec
          $CC $F -DSIMD=1 -o ../bin/n-simd128
          $CC $F -DSIMD=1 -DUNROLL=4 -o ../bin/n-simd128-u4
          $CC $F $M -DSIMD=0 -o ../bin/n-hostisa-auto
          $CC $F $M -DSIMD=1 -o ../bin/n-hostisa-simd128
          $CC $F $M -DSIMD=1 -DUNROLL=4 -o ../bin/n-hostisa-simd128-u4
          $CC $F $M -DSIMD=1 -DVB=32 -DUNROLL=2 -o ../bin/n-hostisa-vb32-u2
          $CC $F $M -ffp-contract=off -DSIMD=1 -DVB=32 -DUNROLL=2 -o ../bin/n-hostisa-vb32-u2-nofma
          $CC $F $M -ffp-contract=off -DSIMD=1 -DUNROLL=4 -o ../bin/n-hostisa-simd128-u4-nofma
          if [ "$(uname -s)" = Linux ] && command -v clang >/dev/null; then clang --version | head -1
            clang $F -DSIMD=0 -o ../bin/c-scalar; clang $F $M -DSIMD=0 -o ../bin/c-hostisa-auto; clang $F $M -DSIMD=1 -DVB=32 -DUNROLL=2 -o ../bin/c-hostisa-vb32-u2; clang $F $M -ffp-contract=off -DSIMD=1 -DVB=32 -DUNROLL=2 -o ../bin/c-hostisa-vb32-u2-nofma; fi
          ls ../bin | tr '\n' ' '
      - name: Phase B, wasm source variants vs native
        run: |
          python3 - <<'PY'
          import json, os, glob
          W = os.environ['WASMTIME']; rows = []
          for f in sorted(glob.glob('bin/*')): rows.append({'name': 'native ' + os.path.basename(f), 'cmd': f})
          for v in ('scalar', 'autovec', 'simd', 'simd-u2', 'simd-u4', 'simd-vb32', 'simd-vb32-u2', 'relaxed', 'relaxed-u2'): rows.append({'name': f'wasmtime {v}', 'cmd': f'{W} run so/so-{v}.wasm'})
          json.dump(rows, open('spec-b.json', 'w'))
          PY
          python3 wasm-perf/runner.py spec-b.json --rounds 3 --ref 'native n-scalar' --kernels matmul256,nbody1024,transform,interp,hash16MB,sort1M --title "Phase B ${{ matrix.label }}: wasm source variants vs native (ref = native scalar, baseline ISA)"
