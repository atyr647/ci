name: darling
# Can Darling (Mach-O on Linux) be installed on a hosted runner, and does it run (a) a plain Mach-O (b) a Cosmopolitan APE?
on:
  workflow_dispatch:
  push:
    paths: ['darling-test/**', '.github/workflows/darling.yml']
jobs:
  release-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: { contents: write }
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - name: What is available upstream
        run: |
          gh release list -R darlinghq/darling -L 5 || true
          gh release view -R darlinghq/darling --json tagName,assets -q '.tagName, (.assets[].name)' || true
      - name: Test binaries (Mach-O via zig, plus a Cosmopolitan APE)
        run: |
          sudo sh -c 'echo -1 > /proc/sys/fs/binfmt_misc/status' || true   # the runner registers dotnet for MZ files, which hijacks APEs
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz && tar xJf zig.tar.xz
          Z=$PWD/zig-linux-x86_64-0.13.0/zig
          $Z cc -target x86_64-macos -O1 -o hello-macho darling-test/hello.c
          file hello-macho
          curl -fsSL -o cosmocc.zip https://github.com/jart/cosmopolitan/releases/download/4.0.2/cosmocc-4.0.2.zip && mkdir cosmo && unzip -q cosmocc.zip -d cosmo
          cp cosmo/bin/ape-x86_64.elf ~/.ape-1.10; chmod +x ~/.ape-1.10
          cosmo/bin/cosmocc -O1 -o hello-ape.com darling-test/hello.c
      - name: Mirror the upstream Darling debs into a release of this repo
        continue-on-error: true
        run: |
          gh release delete darling-debs-20260609 --cleanup-tag -y --repo ${{ github.repository }} || true   # re-create from the current (rewritten) history
          mkdir -p mirror && gh release download -R darlinghq/darling -p 'debs_*.zip' -D mirror
          gh release create darling-debs-20260609 mirror/debs_*.zip --repo ${{ github.repository }} --title "Darling debs (upstream v0.1.20260608, mirrored)" --notes "Mirror of darlinghq/darling release assets, for use inside sandboxes that cannot reach upstream." || gh release upload darling-debs-20260609 mirror/debs_*.zip --repo ${{ github.repository }} --clobber
      - name: Install Darling from the upstream release .deb
        continue-on-error: true
        id: inst
        run: |
          set -x
          mkdir debs && gh release download -R darlinghq/darling -p 'debs_*.zip' -D debs && (cd debs && unzip -o -q debs_*.zip)
          ls -la debs
          sudo apt-get update
          sudo apt-get install -y dkms linux-headers-$(uname -r) || sudo apt-get install -y dkms
          find debs -name '*.deb' | head -30; sudo apt-get install -y $(find debs -name '*.deb' | sort | sed 's|^|./|')
          dkms status || true
          sudo modprobe darling-mach || sudo dmesg | tail -20
          lsmod | grep -i darling || true
      - name: Run under Darling
        continue-on-error: true
        run: |
          which darling && darling --version || true
          darling shell uname -a
          darling shell sw_vers || true
          darling "$PWD/hello-macho"
          echo "--- APE under Darling"
          darling shell "$PWD/hello-ape.com" || true
