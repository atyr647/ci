name: dawn-native-cosmoclang
# Is the remaining x86-64 shader-compile gap (Cosmopolitan Dawn about 16% slower than native) a property of the clang that ships in cosmocc (version, inlining) rather than of Cosmopolitan?
# Native Dawn (system libstdc++, glibc, no Cosmopolitan libc) is built here with that clang, and run interleaved against native Dawn built by the system clang and against the Cosmopolitan build.
on:
  workflow_dispatch:
    inputs:
      cosmo_run: { description: 'dawn-cosmo run with artifact wgt-dawn', required: true }
      rounds: { description: 'interleaved rounds', required: false, default: '7' }
env:
  DAWN_SHA: 106704a9ac3fc21b1580ea85aea302ac17d416f1
  COSMOCC: 4.0.2
jobs:
  cc:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies and the clang of cosmocc
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build clang mesa-vulkan-drivers libvulkan1
          curl -fsSL -o cosmocc.zip https://github.com/jart/cosmopolitan/releases/download/$COSMOCC/cosmocc-$COSMOCC.zip && mkdir cosmo && unzip -q cosmocc.zip -d cosmo
          cp cosmo/bin/ape-x86_64.elf $HOME/.ape-1.10 && chmod +x $HOME/.ape-1.10
          clang --version | head -1; "$PWD/cosmo/libexec/clang" --version | head -3 || true
          # the cosmocc clang is an APE binary; give it a plain-ELF wrapper for the native toolchain, with the system's resource directory (for stddef.h and the like)
          RD=$(clang -print-resource-dir); echo "resource dir: $RD"
          printf '#!/bin/sh\nexec %s/cosmo/libexec/clang -resource-dir %s -idirafter /usr/include/x86_64-linux-gnu -idirafter /usr/include "$@"\n' "$PWD" "$RD" > $HOME/cc-clang; printf '#!/bin/sh\nexec %s/cosmo/libexec/clang --driver-mode=g++ -resource-dir %s -idirafter /usr/include/x86_64-linux-gnu -idirafter /usr/include "$@"\n' "$PWD" "$RD" > $HOME/cc-clangxx
          chmod +x $HOME/cc-clang $HOME/cc-clangxx; echo 'int main(){return 0;}' > t.c; $HOME/cc-clang t.c -o t && ./t && echo "cosmocc clang compiles and links natively"
      - name: Restore native Dawn built by the system clang
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: dawn-native-static-linux-x64-${{ env.DAWN_SHA }}-v1
          fail-on-cache-miss: true
      - name: Restore or build native Dawn with the clang of cosmocc
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: dist-cc
          key: dawn-native-cosmoclang-linux-x64-${{ env.DAWN_SHA }}-v1
      - name: Build native Dawn with the clang of cosmocc (only when not cached)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir dawn && cd dawn && git init -q && git remote add origin https://github.com/google/dawn.git && git fetch -q --depth 1 origin $DAWN_SHA && git checkout -q FETCH_HEAD && cd ..
          cmake -S dawn -B out -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=$HOME/cc-clang -DCMAKE_CXX_COMPILER=$HOME/cc-clangxx -DDAWN_FETCH_DEPENDENCIES=ON -DDAWN_BUILD_MONOLITHIC_LIBRARY=STATIC -DDAWN_ENABLE_INSTALL=ON \
            -DDAWN_BUILD_SAMPLES=OFF -DDAWN_BUILD_TESTS=OFF -DDAWN_BUILD_BENCHMARKS=OFF -DTINT_BUILD_TESTS=OFF -DTINT_BUILD_CMD_TOOLS=OFF -DDAWN_ENABLE_DESKTOP_GL=OFF -DDAWN_ENABLE_OPENGLES=OFF \
            -DDAWN_USE_X11=OFF -DDAWN_USE_WAYLAND=OFF -DDAWN_USE_GLFW=OFF -DDAWN_ENABLE_NULL=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DDAWN_SUPPORTS_CXX_MODULES=OFF \
            -DDAWN_ENABLE_VULKAN=ON -DDAWN_ENABLE_D3D12=OFF -DDAWN_ENABLE_D3D11=OFF -DDAWN_ENABLE_METAL=OFF 2>&1 | tail -5
          cmake --build out && cmake --install out --prefix "$PWD/dist-cc"
      - name: Save native Dawn built with the clang of cosmocc
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist-cc
          key: dawn-native-cosmoclang-linux-x64-${{ env.DAWN_SHA }}-v1
      - name: Benchmarks
        run: |
          cmake -S ci-webgpu-test/bench -B b-sys -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/dist" -DCMAKE_CXX_COMPILER=clang++ && cmake --build b-sys --target dawn-bench
          cmake -S ci-webgpu-test/bench -B b-cc -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/dist-cc" -DCMAKE_CXX_COMPILER=$HOME/cc-clangxx && cmake --build b-cc --target dawn-bench
          mkdir bins && cp b-sys/dawn-bench bins/bench-sysclang && cp b-cc/dawn-bench bins/bench-cosmoclang
      - name: The Cosmopolitan build
        run: gh run download ${{ inputs.cosmo_run }} -R ${{ github.repository }} -n wgt-dawn -D cosmo-run && chmod +x cosmo-run/dawn-bench.com
      - name: Run (interleaved)
        run: |
          args=(--rounds ${{ inputs.rounds }} --title "linux-x64: native by the system clang / native by the clang of cosmocc / Cosmopolitan" --json out.json
                --variant "native-sysclang|WGT_BACKEND=vulkan|./bins/bench-sysclang" --variant "native-cosmoclang|WGT_BACKEND=vulkan|./bins/bench-cosmoclang"
                --variant "cosmo|WGT_BACKEND=vulkan|sh ./cosmo-run/dawn-bench.com" --variant "native-sysclang-again|WGT_BACKEND=vulkan|./bins/bench-sysclang")
          python3 ci-webgpu-test/bench_ab.py "${args[@]}" 2>&1 | tee bench-out.txt
      - name: Result (last)
        if: always()
        run: tail -n 45 bench-out.txt 2>/dev/null | cut -c1-260
