name: wx-policy
# Systems that forbid writable-then-executable memory (systemd MemoryDenyWriteExecute=yes, the kernel's MDWE): what happens to the game file there?
# The file needs executable memory for two things: the wasm code Wasmtime loads (written, then made executable) and, in the software fallback, SwiftShader's JIT.
on:
  workflow_dispatch:
    inputs:
      game_run: { description: 'gameloop run whose artifact "game" (game.com) is tested', required: true }
jobs:
  wx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,   os: ubuntu-latest }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - run: |
          uname -r; systemctl --version | head -1; cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null; grep -c . /sys/kernel/security/lsm 2>/dev/null && cat /sys/kernel/security/lsm
          gh run download ${{ inputs.game_run }} -R ${{ github.repository }} -n game -D g; chmod +x g/game.com; cc -O2 alloc-probe/mdwe.c -o mdwe; ls -la g
      - name: Phase 1 - no system Vulkan driver on the machine - without a policy (the driver inside the file is used)
        env: { WGT_BACKEND: vulkan }
        run: |
          cd g; set +e; sh ./game.com > ../p1_base.txt 2>&1; echo "exit $?"; tr '\r' '\n' < ../p1_base.txt | grep -E "RESULT|adapter|GPU compl" | head -5
      - name: Phase 1 - systemd MemoryDenyWriteExecute=yes (what hardened services use)
        env: { WGT_BACKEND: vulkan }
        run: |
          cd g; set +e; sudo systemd-run --pipe --wait --collect -p MemoryDenyWriteExecute=yes -p WorkingDirectory=$PWD -p User=$(id -un) -p Environment=HOME=$HOME -p Environment=WGT_BACKEND=vulkan sh ./game.com > ../p1_sd.txt 2>&1; echo "exit $?"
          tr '\r' '\n' < ../p1_sd.txt | grep -vE "^Warning|^$" | head -20 | cut -c1-240
      - name: Phase 1 - kernel MDWE (prctl PR_SET_MDWE, refuse exec gain)
        env: { WGT_BACKEND: vulkan }
        run: |
          cd g; set +e; ../mdwe sh ./game.com > ../p1_k.txt 2>&1; echo "exit $?"; tr '\r' '\n' < ../p1_k.txt | grep -vE "^Warning|^$" | head -14 | cut -c1-240
      - name: Phase 2 - Mesa's Vulkan driver installed (a system driver that itself JITs) - no policy, then the policies
        env: { WGT_BACKEND: vulkan }
        run: |
          set +e; sudo apt-get update >/dev/null; sudo apt-get install -y mesa-vulkan-drivers libvulkan1 >/dev/null 2>&1; cd g
          echo "=== no policy"; sh ./game.com > ../p2_base.txt 2>&1; echo "exit $?"; tr '\r' '\n' < ../p2_base.txt | grep -E "RESULT|adapter" | head -3
          echo "=== systemd MemoryDenyWriteExecute=yes"; sudo systemd-run --pipe --wait --collect -p MemoryDenyWriteExecute=yes -p WorkingDirectory=$PWD -p User=$(id -un) -p Environment=HOME=$HOME -p Environment=WGT_BACKEND=vulkan sh ./game.com > ../p2_sd.txt 2>&1; echo "exit $?"; tr '\r' '\n' < ../p2_sd.txt | grep -vE "^Warning|^$" | head -16 | cut -c1-240
          echo "=== kernel MDWE"; ../mdwe sh ./game.com > ../p2_k.txt 2>&1; echo "exit $?"; tr '\r' '\n' < ../p2_k.txt | grep -vE "^Warning|^$" | head -16 | cut -c1-240
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'wx-${{ matrix.label }}', path: "*.txt" }
