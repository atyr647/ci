name: wx-policy
# Systems that forbid writable-then-executable memory (systemd MemoryDenyWriteExecute=yes, the kernel's MDWE): what happens to the game file there?
# The file needs executable memory for two things: the wasm code Wasmtime loads (written, then made executable) and, in the software fallback, SwiftShader's JIT.
on:
  workflow_dispatch:
    inputs:
      game_run: { description: 'gameloop run whose artifact "game" (game.com) is tested', required: true }
jobs:
  wx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,   os: ubuntu-latest }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - run: |
          uname -r; systemctl --version | head -1; cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null; grep -c . /sys/kernel/security/lsm 2>/dev/null && cat /sys/kernel/security/lsm
          gh run download ${{ inputs.game_run }} -R ${{ github.repository }} -n game -D g; chmod +x g/game.com; cc -O2 alloc-probe/mdwe.c -o mdwe; ls -la g
      - name: Baseline (no policy)
        run: |
          cd g; set +e; sh ./game.com > ../base.txt 2>&1; echo "exit $?"; tr '\r' '\n' < ../base.txt | grep -E "RESULT|adapter|FAIL|error" | head -5
      - name: systemd MemoryDenyWriteExecute=yes (what hardened services use), default GPU choice
        run: |
          cd g; set +e; sudo systemd-run --pipe --wait --collect -p MemoryDenyWriteExecute=yes -p WorkingDirectory=$PWD -p User=$(id -un) -p Environment=HOME=$HOME sh ./game.com > ../mdwe_sd.txt 2>&1; echo "exit $?"
          tr '\r' '\n' < ../mdwe_sd.txt | head -40 | cut -c1-240
      - name: Kernel MDWE (prctl PR_SET_MDWE, refuse exec gain)
        run: |
          cd g; set +e; ../mdwe sh ./game.com > ../mdwe_k.txt 2>&1; echo "exit $?"
          tr '\r' '\n' < ../mdwe_k.txt | head -40 | cut -c1-240
      - name: Same, with strace of the denied calls
        run: |
          set +e; sudo apt-get install -y strace >/dev/null 2>&1; cd g
          ../mdwe strace -f -e trace=mmap,mprotect,pkey_mprotect -o ../st.txt sh ./game.com > /dev/null 2>&1
          echo "denied calls:"; grep -E "EACCES|EPERM" ../st.txt | head -12 | cut -c1-200; echo "count: $(grep -cE 'EACCES|EPERM' ../st.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'wx-${{ matrix.label }}', path: "*.txt" }
