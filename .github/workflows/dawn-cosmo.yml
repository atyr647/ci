name: dawn-cosmo
# Dawn (Vulkan backend, headless) compiled with the Cosmopolitan toolchain for x86-64 AND arm64, linked with the WebGPU compute test
# into ONE fat executable, then run on Linux x64/arm64, Windows x64/arm64 and macOS arm64.
on:
  workflow_dispatch:
env:
  DAWN_SHA: 106704a9ac3fc21b1580ea85aea302ac17d416f1
  COSMOCC: 4.0.2
  DXH_SHA: faf928dc6feb8b86e9e3d6a39fc5171de7d8ac36   # microsoft/DirectX-Headers (Agility SDK level names that Dawn's D3D12 code uses)
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      COSMO_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          curl -fsSL -o cosmocc.zip https://github.com/jart/cosmopolitan/releases/download/$COSMOCC/cosmocc-$COSMOCC.zip
          mkdir -p $HOME/cosmo && unzip -q cosmocc.zip -d $HOME/cosmo
          cp $HOME/cosmo/bin/ape-x86_64.elf $HOME/.ape-1.10 && chmod +x $HOME/.ape-1.10
      - name: Inputs for the in-file D3D12 backend (Wine's Windows headers, newer DirectX-Headers, generated shims) - x86_64 only, Windows runs x86-64 code
        if: matrix.arch == 'x86_64'
        run: |
          sh backend-spikes/setup-wine-headers.sh $PWD/wine
          mkdir dxh && git -C dxh init -q && git -C dxh fetch -q --depth 1 https://github.com/microsoft/DirectX-Headers $DXH_SHA && git -C dxh checkout -q FETCH_HEAD
          W=$PWD/wine/x/usr/include/wine/wine
          python3 dawn-cosmo/fix_com_struct_returns.py dxh/include/directx   # result pointer order of struct-returning COM methods (GCC vs Microsoft)
          python3 backend-spikes/make_sal_shim.py dawn-cosmo/d3d12-shims/sal_shim.h dxh/include/directx/*.h dawn-cosmo/d3d12-shims/dxcapi.h
          python3 backend-spikes/make_uuid_decls.py dawn-cosmo/d3d12-shims/uuid_decls.h $W/windows dxh/include/directx dawn-cosmo/d3d12-shims
      - name: Restore the Dawn checkout and build directory from the last run
        uses: actions/cache/restore@v4
        with:
          path: |
            dawn
            build
          key: dawn-cosmo-${{ matrix.arch }}-${{ env.DAWN_SHA }}-v3-${{ github.run_id }}
          restore-keys: dawn-cosmo-${{ matrix.arch }}-${{ env.DAWN_SHA }}-v3-
      - name: Fetch Dawn at the pinned commit (unless restored)
        run: |
          if [ ! -d dawn/.git ]; then
            mkdir -p dawn && cd dawn && git init -q && git remote add origin https://github.com/google/dawn.git
            git fetch -q --depth 1 origin $DAWN_SHA && git checkout -q FETCH_HEAD
          fi
      - name: "Patch Dawn (from clean sources - a restored checkout may carry an older, different patch)"
        env:
          DAWN_COSMO_D3D12: ${{ matrix.arch == 'x86_64' && '1' || '0' }}
          DAWN_COSMO_METAL: ${{ matrix.arch == 'aarch64' && '1' || '0' }}
        run: |
          python3 dawn-cosmo/keep_mtimes.py save dawn $RUNNER_TEMP/mtimes.json
          git -C dawn checkout -q -- .
          python3 dawn-cosmo/patch.py dawn
          python3 dawn-cosmo/keep_mtimes.py restore dawn $RUNNER_TEMP/mtimes.json
      - name: Configure
        run: |
          emu=""; [ "$COSMO_ARCH" = x86_64 ] && emu="-DCMAKE_CROSSCOMPILING_EMULATOR=$HOME/.ape-1.10"
          d3d=""
          [ "$COSMO_ARCH" = aarch64 ] && d3d="-DTINT_BUILD_MSL_WRITER=ON"   # the Metal objects (built on macOS, linked into the arm64 half) use Tint's MSL writer
          if [ "$COSMO_ARCH" = x86_64 ]; then
            DXH=$PWD/dxh/include; SH=$PWD/dawn-cosmo/d3d12-shims; FILES=$PWD/dawn-cosmo/files; WINE=$PWD/wine/x/usr/include/wine/wine
            FLAGS="-DDAWN_COSMO_AS_WINDOWS=1;-DNOMINMAX;-DWIN32_LEAN_AND_MEAN;-DWINE_UNICODE_NATIVE;-fshort-wchar;-Dwcslen=dawn_wcslen16;-w;-include$FILES/win32_rename.h;-include$SH/pre.h;-I$SH;-I$DXH/directx;-I$DXH;-I$WINE/windows;-I$WINE"
            d3d="-DDAWN_ENABLE_D3D12=ON -DTINT_BUILD_HLSL_WRITER=ON -DDAWN_COSMO_D3D12=ON -DDAWN_COSMO_FILES_DIR=$FILES"   # (the Tint option is cached from the earlier Vulkan-only configure, so it is set explicitly)
          fi
          cmake -S dawn -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/dawn-cosmo/cosmo.cmake -DCMAKE_BUILD_TYPE=Release \
            -DDAWN_FETCH_DEPENDENCIES=ON -DDAWN_ENABLE_VULKAN=ON -DDAWN_ENABLE_D3D12=OFF -DDAWN_ENABLE_D3D11=OFF -DDAWN_ENABLE_METAL=OFF \
            -DDAWN_ENABLE_DESKTOP_GL=OFF -DDAWN_ENABLE_OPENGLES=OFF -DDAWN_ENABLE_NULL=ON -DDAWN_USE_X11=OFF -DDAWN_USE_WAYLAND=OFF -DDAWN_USE_GLFW=OFF \
            -DDAWN_BUILD_SAMPLES=OFF -DDAWN_BUILD_TESTS=OFF -DDAWN_BUILD_BENCHMARKS=OFF -DTINT_BUILD_TESTS=OFF -DTINT_BUILD_CMD_TOOLS=OFF \
            -DDAWN_BUILD_MONOLITHIC_LIBRARY=STATIC -DDAWN_ENABLE_INSTALL=OFF -DDAWN_BUILD_PROTOBUF=OFF $emu $d3d ${FLAGS:+"-DDAWN_COSMO_D3D12_FLAGS=$FLAGS"} 2>&1 | tee configure.log | tail -30
          if [ "$COSMO_ARCH" = x86_64 ]; then
            # the newer DirectX-Headers and the DXC header without its WinAdapter replace the ones Dawn fetched (they come first on the include path)
            cp -r dxh/include/directx/. dawn/third_party/directx-headers/src/include/directx/
            cp dawn-cosmo/d3d12-shims/dxcapi.h dawn/third_party/directx-shader-compiler/src/include/dxc/dxcapi.h
          fi
      - name: Build libwebgpu_dawn.a (keep going to collect every error)
        run: |
          cmake --build build --target webgpu_dawn -- -k 0 > build.log 2>&1 || true
          echo '=== failed objects'; grep 'FAILED:' build.log | cut -c1-200 | head -40
          echo '=== distinct errors'; grep -E 'error:|undefined reference' build.log | sed -E 's#/home/runner/work/ci/ci/dawn/##' | cut -c1-230 | sort | uniq -c | sort -rn | head -40
          tail -3 build.log
          find build -name 'libwebgpu_dawn.a' -exec ls -la {} \;
          test -n "$(find build -name libwebgpu_dawn.a)"
          ! grep -q '^FAILED:' build.log   # a stale libwebgpu_dawn.a from the cache must not hide failed objects
      - name: Save the Dawn checkout and build directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dawn
            build
          key: dawn-cosmo-${{ matrix.arch }}-${{ env.DAWN_SHA }}-v3-${{ github.run_id }}
      - name: Package the library and headers (linked in the link job, together with the Metal objects for arm64)
        run: |
          mkdir -p dist/inc1 dist/inc2
          cp "$(find build -name libwebgpu_dawn.a | head -1)" dist/
          cp -r dawn/include/. dist/inc1/ && cp -r build/gen/include/. dist/inc2/
          ls -la dist
      - name: Inputs for the macOS job - the exact flags of this build and the headers (arm64 only)
        if: matrix.arch == 'aarch64'
        run: python3 dawn-cosmo/metal/export_inputs.py "$PWD" "$PWD/build" metal-inputs && ls -la metal-inputs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'logs-${{ matrix.arch }}', path: "*.log" }
      - uses: actions/upload-artifact@v4
        with: { name: 'lib-${{ matrix.arch }}', path: dist, compression-level: 1 }
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'aarch64'
        with: { name: metal-inputs, path: metal-inputs, compression-level: 1 }

  metal:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: metal-inputs, path: dl }
      - name: Tools
        run: |
          curl -fsSL -o cosmocc.zip https://github.com/jart/cosmopolitan/releases/download/$COSMOCC/cosmocc-$COSMOCC.zip
          mkdir cosmo && unzip -q cosmocc.zip -d cosmo
          xcrun --show-sdk-path
      - name: Compile Dawn's Metal backend with the Cosmopolitan clang against the Apple SDK (same flags as the rest of Dawn), generate the Objective-C runtime shim
        run: |
          mkdir inputs && tar xzf dl/inputs.tar.gz -C inputs && cp dl/flags.json inputs/
          python3 dawn-cosmo/metal/build_objs.py "$PWD/inputs" "$PWD/cosmo/bin" "$(xcrun --show-sdk-path)" "$PWD/out" 2>&1 | tee metal-build.log | tail -150
          ls -la out out/objs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: metal-log, path: metal-build.log }
      - uses: actions/upload-artifact@v4
        with: { name: metal-objs, path: "out/objs\nout/objc_shim.c\nout/undefined.txt" }

  link:
    needs: [build, metal]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          curl -fsSL -o cosmocc.zip https://github.com/jart/cosmopolitan/releases/download/$COSMOCC/cosmocc-$COSMOCC.zip
          mkdir -p cosmo && unzip -q cosmocc.zip -d cosmo
          cp cosmo/bin/ape-x86_64.elf $HOME/.ape-1.10 && chmod +x $HOME/.ape-1.10
      - uses: actions/download-artifact@v4
        with: { name: lib-x86_64, path: lib-x86_64 }
      - uses: actions/download-artifact@v4
        with: { name: lib-aarch64, path: lib-aarch64 }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: metal-objs, path: metal }
      - name: Link the WebGPU test and the GPU probe for each architecture (arm64 also gets the Metal objects and the Objective-C shim)
        run: |
          B=$PWD/cosmo/bin
          mkdir parts
          for A in x86_64 aarch64; do
            L=$PWD/lib-$A; INC="-I$L/inc1 -I$L/inc2 -I$PWD/ci-webgpu-test"; extra=""
            if [ $A = aarch64 ] && [ -f metal/objc_shim.c ]; then
              $B/aarch64-unknown-cosmo-cc -O2 -c metal/objc_shim.c -o objc_shim.o
              extra="$(ls $PWD/metal/objs/*.o) objc_shim.o"
              echo "arm64: linking $(ls metal/objs/*.o | wc -l) Metal objects"
            fi
            $B/$A-unknown-cosmo-cc -O2 $INC -c ci-webgpu-test/wgt.c -o wgt.$A.o
            $B/$A-unknown-cosmo-c++ -O2 wgt.$A.o $extra "$L/libwebgpu_dawn.a" -Wl,--wrap=pthread_create -o parts/wgt.$A.com
            $B/$A-unknown-cosmo-c++ -O2 -std=c++20 $INC -c ci-webgpu-test/gpu_probe.cpp -o gpu_probe.$A.o
            $B/$A-unknown-cosmo-c++ -O2 gpu_probe.$A.o $extra "$L/libwebgpu_dawn.a" -Wl,--wrap=pthread_create -o parts/gpu-probe.$A.com
            $B/$A-unknown-cosmo-c++ -O2 -std=c++17 $INC -c ci-webgpu-test/dawn_bench.cpp -o dawn_bench.$A.o
            $B/$A-unknown-cosmo-c++ -O2 dawn_bench.$A.o $extra "$L/libwebgpu_dawn.a" -Wl,--wrap=pthread_create -o parts/dawn-bench.$A.com
          done
          ls -la parts
      - name: One fat file
        run: |
          B=$PWD/cosmo/bin
          for n in wgt gpu-probe dawn-bench; do
            $B/apelink -V -1 -l $B/ape-x86_64.elf -l $B/ape-aarch64.elf -M $B/ape-m1.c -o $( [ $n = wgt ] && echo wgt-dawn || echo $n ).com parts/$n.x86_64.com.dbg parts/$n.aarch64.com.dbg
          done
          $B/cosmocc -O1 -Ici-webgpu-test ci-webgpu-test/d3d12min.c -o d3d12min.com
          ls -la wgt-dawn.com gpu-probe.com dawn-bench.com d3d12min.com
      - uses: actions/upload-artifact@v4
        with: { name: wgt-dawn, path: "wgt-dawn.com\ngpu-probe.com\ndawn-bench.com\nd3d12min.com" }

  test:
    needs: link
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,   os: ubuntu-latest }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
          - { label: win-x64,     os: windows-latest }
          - { label: win-arm64,   os: windows-11-arm }
          - { label: mac-arm64,   os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    env:
      RUNNER_LABEL: ${{ matrix.label }}
      GH_TOKEN: ${{ github.token }}
      WGT_BACKEND: ${{ startsWith(matrix.label, 'win') && 'd3d12' || 'vulkan' }}   # Windows: D3D12 only, Vulkan is not started there
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wgt-dawn, path: . }
      - name: Vulkan software driver (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Vulkan loader + MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk vulkan-loader >/dev/null 2>&1 || brew install molten-vk vulkan-loader
          echo "VK_ICD_FILENAMES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix vulkan-loader)/lib" >> "$GITHUB_ENV"
      - name: Run the ONE file
        continue-on-error: true
        run: |
          chmod +x ci-webgpu-test/run-one.sh
          if [ "$RUNNER_OS" = Windows ]; then cp wgt-dawn.com wgt-dawn.exe; ci-webgpu-test/run-one.sh "dawn built by cosmocc ($WGT_BACKEND)" ./wgt-dawn.exe
          else chmod +x wgt-dawn.com; ci-webgpu-test/run-one.sh "dawn built by cosmocc ($WGT_BACKEND)" sh ./wgt-dawn.com; fi
      - name: Which GPU would the game use (policy self-test + every adapter Dawn sees)
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = Windows ]; then cp gpu-probe.com gpu-probe.exe; ( ./gpu-probe.exe --bench 2>&1 | cat ) | tr '\r' '\n' | grep -v Warning
          else chmod +x gpu-probe.com; sh ./gpu-probe.com --bench 2>&1 | grep -v Warning; fi
      - name: macOS only - the Metal backend compiled into the file (Apple GPU of the runner, reached without MoltenVK)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          chmod +x wgt-dawn.com gpu-probe.com
          export WGT_BACKEND=metal
          ci-webgpu-test/run-one.sh "dawn built by cosmocc (Metal)" sh ./wgt-dawn.com 2>&1 | grep -v '^ *\[vk\]' | tail -40
          echo "--- with Dawn-cosmo trace (backend connect lines only)"
          DAWN_COSMO_TRACE=1 sh ./wgt-dawn.com 2>&1 | grep -E 'dawn-cosmo|adapter:|RESULT|stage:|error|Error|FAIL' | head -20
          echo "--- every adapter, all backends"
          unset WGT_BACKEND; sh ./gpu-probe.com --bench 2>&1 | grep -v Warning | tail -30
      - name: "Windows only - the D3D12 backend compiled into the file (WARP, Windows' software adapter, shows up as a CPU adapter: the runner has no GPU)"
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          cp wgt-dawn.com wgt-dawn.exe
          export WGT_BACKEND=d3d12 DAWN_COSMO_TRACE=1
          cp gpu-probe.com gpu-probe.exe
          echo "--- every adapter Dawn finds when D3D12 is requested (all log lines, nothing filtered)"
          set +e
          ( ./gpu-probe.exe 2>&1 | cat ) > d3dprobe.txt; echo "probe exit status: ${PIPESTATUS[0]}"
          tr '\r' '\n' < d3dprobe.txt | grep -v "^  ok\|policy selftest" | head -30
          echo "--- the same with --strace (last 60 lines: which Windows calls came last)"
          ( ./gpu-probe.exe --strace 2>&1 | cat ) > d3dstrace.txt
          tr '\r' '\n' < d3dstrace.txt | tail -60 | cut -c1-220
          set -e
          cp d3d12min.com d3d12min.exe
          echo "--- the smallest D3D12 test (no Dawn), with the exception wrapper"
          ( ./d3d12min.exe 2>&1 | cat ) | tr '\r' '\n' | head -30 || true
          echo "--- with the exception wrapper AND the thread block's stack limits set to Cosmopolitan's stack"
          ( ./d3d12min.exe 2>&1 | cat ) | tr '\r' '\n' | head -30 || true
          echo "--- and without the wrapper"
          ( NO_SHIELD=1 ./d3d12min.exe 2>&1 | cat ) | tr '\r' '\n' | head -30 || true
          echo "--- D3D12, no DXC next to the executable"
          ci-webgpu-test/run-one.sh "dawn built by cosmocc (D3D12 WARP, FXC)" ./wgt-dawn.exe
          echo "--- D3D12 with Microsoft's DXC next to the executable"
          gh release download -R microsoft/DirectXShaderCompiler -p 'dxc_*.zip' -D dxc --clobber && (cd dxc && cmake -E tar xf dxc_*.zip)
          d=$(dirname "$(find dxc -ipath '*x64*' -name dxcompiler.dll | head -1)"); cp "$d/dxcompiler.dll" "$d/dxil.dll" . && ls -la dxcompiler.dll dxil.dll
          ci-webgpu-test/run-one.sh "dawn built by cosmocc (D3D12 WARP, DXC)" ./wgt-dawn.exe
