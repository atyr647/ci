name: dawn-cosmo
# Dawn (Vulkan backend, headless) compiled with the Cosmopolitan toolchain for x86-64 AND arm64, linked with the WebGPU compute test
# into ONE fat executable, then run on Linux x64/arm64, Windows x64/arm64 and macOS arm64.
on:
  workflow_dispatch:
env:
  DAWN_SHA: 106704a9ac3fc21b1580ea85aea302ac17d416f1
  COSMOCC: 4.0.2
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      COSMO_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          curl -fsSL -o cosmocc.zip https://github.com/jart/cosmopolitan/releases/download/$COSMOCC/cosmocc-$COSMOCC.zip
          mkdir -p $HOME/cosmo && unzip -q cosmocc.zip -d $HOME/cosmo
          cp $HOME/cosmo/bin/ape-x86_64.elf $HOME/.ape-1.10 && chmod +x $HOME/.ape-1.10
      - name: Restore the Dawn checkout and build directory from the last run
        uses: actions/cache/restore@v4
        with:
          path: |
            dawn
            build
          key: dawn-cosmo-${{ matrix.arch }}-${{ env.DAWN_SHA }}-v3-${{ github.run_id }}
          restore-keys: dawn-cosmo-${{ matrix.arch }}-${{ env.DAWN_SHA }}-v3-
      - name: Fetch Dawn at the pinned commit (unless restored)
        run: |
          if [ ! -d dawn/.git ]; then
            mkdir -p dawn && cd dawn && git init -q && git remote add origin https://github.com/google/dawn.git
            git fetch -q --depth 1 origin $DAWN_SHA && git checkout -q FETCH_HEAD
          fi
      - name: Patch Dawn
        run: python3 dawn-cosmo/patch.py dawn
      - name: Configure
        run: |
          emu=""; [ "$COSMO_ARCH" = x86_64 ] && emu="-DCMAKE_CROSSCOMPILING_EMULATOR=$HOME/.ape-1.10"
          cmake -S dawn -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/dawn-cosmo/cosmo.cmake -DCMAKE_BUILD_TYPE=Release \
            -DDAWN_FETCH_DEPENDENCIES=ON -DDAWN_ENABLE_VULKAN=ON -DDAWN_ENABLE_D3D12=OFF -DDAWN_ENABLE_D3D11=OFF -DDAWN_ENABLE_METAL=OFF \
            -DDAWN_ENABLE_DESKTOP_GL=OFF -DDAWN_ENABLE_OPENGLES=OFF -DDAWN_ENABLE_NULL=ON -DDAWN_USE_X11=OFF -DDAWN_USE_WAYLAND=OFF -DDAWN_USE_GLFW=OFF \
            -DDAWN_BUILD_SAMPLES=OFF -DDAWN_BUILD_TESTS=OFF -DDAWN_BUILD_BENCHMARKS=OFF -DTINT_BUILD_TESTS=OFF -DTINT_BUILD_CMD_TOOLS=OFF \
            -DDAWN_BUILD_MONOLITHIC_LIBRARY=STATIC -DDAWN_ENABLE_INSTALL=OFF -DDAWN_BUILD_PROTOBUF=OFF $emu 2>&1 | tee configure.log | tail -30
      - name: Build libwebgpu_dawn.a (keep going to collect every error)
        run: |
          cmake --build build --target webgpu_dawn -- -k 0 > build.log 2>&1 || true
          echo '=== failed objects'; grep 'FAILED:' build.log | cut -c1-200 | head -40
          echo '=== distinct errors'; grep -E 'error:|undefined reference' build.log | sed -E 's#/home/runner/work/ci/ci/dawn/##' | cut -c1-230 | sort | uniq -c | sort -rn | head -40
          tail -3 build.log
          find build -name 'libwebgpu_dawn.a' -exec ls -la {} \;
          test -n "$(find build -name libwebgpu_dawn.a)"
      - name: Save the Dawn checkout and build directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dawn
            build
          key: dawn-cosmo-${{ matrix.arch }}-${{ env.DAWN_SHA }}-v3-${{ github.run_id }}
      - name: Link the WebGPU test and the GPU probe against it (one architecture)
        run: |
          B=$HOME/cosmo/bin; lib=$(find $PWD/build -name libwebgpu_dawn.a | head -1)
          INC="-I$PWD/dawn/include -I$PWD/build/gen/include -I$PWD/ci-webgpu-test"
          $B/$COSMO_ARCH-unknown-cosmo-cc -O2 $INC -c ci-webgpu-test/wgt.c -o wgt.o
          $B/$COSMO_ARCH-unknown-cosmo-c++ -O2 wgt.o "$lib" -o wgt.$COSMO_ARCH.com
          $B/$COSMO_ARCH-unknown-cosmo-c++ -O2 -std=c++20 $INC -c ci-webgpu-test/gpu_probe.cpp -o gpu_probe.o
          $B/$COSMO_ARCH-unknown-cosmo-c++ -O2 gpu_probe.o "$lib" -o gpu-probe.$COSMO_ARCH.com
          ls -la wgt.$COSMO_ARCH.com* gpu-probe.$COSMO_ARCH.com*
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'logs-${{ matrix.arch }}', path: "*.log" }
      - uses: actions/upload-artifact@v4
        with: { name: 'wgt-${{ matrix.arch }}', path: "wgt.${{ matrix.arch }}.com.dbg\ngpu-probe.${{ matrix.arch }}.com.dbg" }

  link:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Tools
        run: |
          curl -fsSL -o cosmocc.zip https://github.com/jart/cosmopolitan/releases/download/$COSMOCC/cosmocc-$COSMOCC.zip
          mkdir -p cosmo && unzip -q cosmocc.zip -d cosmo
      - uses: actions/download-artifact@v4
        with: { name: wgt-x86_64, path: parts }
      - uses: actions/download-artifact@v4
        with: { name: wgt-aarch64, path: parts }
      - name: One fat file
        run: |
          B=$PWD/cosmo/bin
          for n in wgt gpu-probe; do
            $B/apelink -V -1 -l $B/ape-x86_64.elf -l $B/ape-aarch64.elf -M $B/ape-m1.c -o $( [ $n = wgt ] && echo wgt-dawn || echo gpu-probe ).com parts/$n.x86_64.com.dbg parts/$n.aarch64.com.dbg
          done
          ls -la wgt-dawn.com gpu-probe.com
      - uses: actions/upload-artifact@v4
        with: { name: wgt-dawn, path: "wgt-dawn.com\ngpu-probe.com" }

  test:
    needs: link
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,   os: ubuntu-latest }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
          - { label: win-x64,     os: windows-latest }
          - { label: win-arm64,   os: windows-11-arm }
          - { label: mac-arm64,   os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    env:
      RUNNER_LABEL: ${{ matrix.label }}
      GH_TOKEN: ${{ github.token }}
      WGT_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: wgt-dawn, path: . }
      - name: Vulkan software driver (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Vulkan software driver (Windows - Mesa lavapipe)
        if: runner.os == 'Windows'
        run: |
          mkdir mesa && cd mesa && gh release download -R pal1000/mesa-dist-win -p '*release-msvc.7z' --clobber && 7z x -y *.7z -ox >/dev/null && cd ..
          icd=$(find mesa/x -iname 'lvp_icd*.json' | grep -i x64 | head -1); echo "ICD: $icd"
          icdw=$(cygpath -w "$(pwd)/$icd"); echo "ICD: $icdw"
          # the loader ignores VK_ICD_FILENAMES / VK_DRIVER_FILES when the process is elevated (GitHub's Windows runners are), so register the driver
          powershell -NoProfile -Command "New-Item -Path 'HKLM:\\SOFTWARE\\Khronos\\Vulkan\\Drivers' -Force | Out-Null; New-ItemProperty -Path 'HKLM:\\SOFTWARE\\Khronos\\Vulkan\\Drivers' -Name '$icdw' -Value 0 -PropertyType DWord -Force | Out-Null"
          ls -la /c/Windows/System32/vulkan-1.dll || true
      - name: Vulkan loader + MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk vulkan-loader >/dev/null 2>&1 || brew install molten-vk vulkan-loader
          echo "VK_ICD_FILENAMES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(brew --prefix vulkan-loader)/lib" >> "$GITHUB_ENV"
      - name: Run the ONE file
        continue-on-error: true
        run: |
          chmod +x ci-webgpu-test/run-one.sh
          if [ "$RUNNER_OS" = Windows ]; then cp wgt-dawn.com wgt-dawn.exe; ci-webgpu-test/run-one.sh "dawn built by cosmocc (Vulkan)" ./wgt-dawn.exe
          else chmod +x wgt-dawn.com; ci-webgpu-test/run-one.sh "dawn built by cosmocc (Vulkan)" sh ./wgt-dawn.com; fi
      - name: Which GPU would the game use (policy self-test + every adapter Dawn sees)
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = Windows ]; then cp gpu-probe.com gpu-probe.exe; ( ./gpu-probe.exe 2>&1 | cat ) | tr '\r' '\n' | grep -v Warning
          else chmod +x gpu-probe.com; sh ./gpu-probe.com 2>&1 | grep -v Warning; fi
      - name: Windows only - last Vulkan calls before a crash (DAWN_COSMO_TRACE) and the syscall tail
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          cp wgt-dawn.com wgt-dawn.exe
          echo "=== Vulkan call trace, last 45 lines"
          ( DAWN_COSMO_TRACE=1 ./wgt-dawn.exe 2>&1 | cat ) > vktrace.txt || true
          tr '\r' '\n' < vktrace.txt | grep -E "^\[vk\]|stage:|Segmentation|compute N" | tail -45
          echo "=== lavapipe with its worker threads off (LP_NUM_THREADS=0)"
          ( LP_NUM_THREADS=0 ./wgt-dawn.exe 2>&1 | cat ) | tr '\r' '\n' | grep -E "stage: map|compute N|RESULT|Segmentation" | head
