name: dawn-native-libcxx
# Why is shader-module compile (Tint) on Linux x86-64 slower in the Cosmopolitan build (0.69x) when a clang-built Cosmopolitan Dawn is as slow as the GCC-built one?
# Candidate: the C++ standard library (Cosmopolitan uses LLVM's libc++, native Linux builds use libstdc++). Native Dawn is built here with clang AND libc++, then
# native clang+libstdc++ (the cache of dawn-bench), native clang+libc++ and the Cosmopolitan build run interleaved on the same machine.
on:
  workflow_dispatch:
    inputs:
      cosmo_run: { description: 'run id of a dawn-cosmo run whose artifact wgt-dawn contains dawn-bench.com', required: true }
      rounds: { description: 'interleaved rounds', required: false, default: '9' }
env:
  DAWN_SHA: 106704a9ac3fc21b1580ea85aea302ac17d416f1
jobs:
  libcxx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,   os: ubuntu-latest }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build clang libc++-dev libc++abi-dev mesa-vulkan-drivers libvulkan1
          clang++ --version | head -1
      - name: Restore native Dawn built with clang + libstdc++ (cache written by dawn-bench)
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: dawn-native-static-${{ matrix.label }}-${{ env.DAWN_SHA }}-v1
          fail-on-cache-miss: true
      - name: Restore native Dawn built with clang + libc++
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: dist-libcxx
          key: dawn-native-libcxx-${{ matrix.label }}-${{ env.DAWN_SHA }}-v1
      - name: Build native Dawn with clang + libc++ (only when not cached)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir dawn && cd dawn && git init -q && git remote add origin https://github.com/google/dawn.git && git fetch -q --depth 1 origin $DAWN_SHA && git checkout -q FETCH_HEAD && cd ..
          cmake -S dawn -B out -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++" \
            -DDAWN_FETCH_DEPENDENCIES=ON -DDAWN_BUILD_MONOLITHIC_LIBRARY=STATIC -DDAWN_ENABLE_INSTALL=ON \
            -DDAWN_BUILD_SAMPLES=OFF -DDAWN_BUILD_TESTS=OFF -DDAWN_BUILD_BENCHMARKS=OFF -DTINT_BUILD_TESTS=OFF -DTINT_BUILD_CMD_TOOLS=OFF -DDAWN_ENABLE_DESKTOP_GL=OFF -DDAWN_ENABLE_OPENGLES=OFF \
            -DDAWN_USE_X11=OFF -DDAWN_USE_WAYLAND=OFF -DDAWN_USE_GLFW=OFF -DDAWN_ENABLE_NULL=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DDAWN_SUPPORTS_CXX_MODULES=OFF \
            -DDAWN_ENABLE_VULKAN=ON -DDAWN_ENABLE_D3D12=OFF -DDAWN_ENABLE_D3D11=OFF -DDAWN_ENABLE_METAL=OFF
          cmake --build out && cmake --install out --prefix "$PWD/dist-libcxx"
      - name: Save native Dawn built with clang + libc++
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist-libcxx
          key: dawn-native-libcxx-${{ matrix.label }}-${{ env.DAWN_SHA }}-v1
      - name: Benchmarks
        run: |
          cmake -S ci-webgpu-test/bench -B b-std -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/dist" -DCMAKE_CXX_COMPILER=clang++ && cmake --build b-std --target dawn-bench
          cmake -S ci-webgpu-test/bench -B b-cxx -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/dist-libcxx" -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++" && cmake --build b-cxx --target dawn-bench
          mkdir bins && cp b-std/dawn-bench bins/bench-libstdcxx && cp b-cxx/dawn-bench bins/bench-libcxx; ldd bins/bench-libcxx | grep -E "libc\+\+|libstdc" ; ldd bins/bench-libstdcxx | grep -E "libc\+\+|libstdc"
      - name: The Cosmopolitan build
        run: gh run download ${{ inputs.cosmo_run }} -R ${{ github.repository }} -n wgt-dawn -D cosmo && chmod +x cosmo/dawn-bench.com
      - name: Run (interleaved)
        run: |
          args=(--rounds ${{ inputs.rounds }} --title "${{ matrix.label }}: native clang+libstdc++ / native clang+libc++ / Cosmopolitan" --json out.json
                --variant "native-libstdcxx|WGT_BACKEND=vulkan|./bins/bench-libstdcxx" --variant "native-libcxx|WGT_BACKEND=vulkan|./bins/bench-libcxx"
                --variant "cosmo|WGT_BACKEND=vulkan|sh ./cosmo/dawn-bench.com" --variant "native-libstdcxx-again|WGT_BACKEND=vulkan|./bins/bench-libstdcxx")
          python3 ci-webgpu-test/bench_ab.py "${args[@]}" 2>&1 | tee bench-out.txt
      - name: Result (last)
        if: always()
        run: tail -n 45 bench-out.txt 2>/dev/null | cut -c1-260
