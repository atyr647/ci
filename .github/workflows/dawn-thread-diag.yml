name: dawn-thread-diag
# The Cosmopolitan Dawn build crashes when the driver is called from a thread the C library created (the whole benchmark in a thread, or Dawn's async pipeline creation on its worker threads), on every OS.
# This prints the crash report (fault address, registers) and tries variants: bigger thread stack, trampolined calls on arm64.
on:
  workflow_dispatch:
    inputs:
      cosmo_run: { description: 'dawn-cosmo run with artifact wgt-dawn', required: true }
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,   os: ubuntu-latest }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - name: Dependencies and the files (the linker's .dbg ELF carries the symbols)
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 gdb
          gh run download ${{ inputs.cosmo_run }} -R ${{ github.repository }} -n dbg-dawn-bench -D d && chmod +x d/*; gh run download ${{ inputs.cosmo_run }} -R ${{ github.repository }} -n wgt-dawn -D c
          A=$(uname -m); echo "DBG=$PWD/d/dawn-bench.$A.com.dbg" >> $GITHUB_ENV; ls -la d
      - name: The benchmark on a created thread - where is every thread when the process does not end (the .dbg ELF, run as the normal user, attached to with gdb)
        run: |
          set +e; export WGT_BACKEND=vulkan BENCH_IN_THREAD=1 DAWN_COSMO_DIAG=1
          $DBG > hang.txt 2>&1 & P=$!
          for i in $(seq 1 60); do sleep 1; grep -q process_total_ms hang.txt && break; done; echo "benchmark output complete after ~$i s"; sleep 12
          if kill -0 $P 2>/dev/null; then echo "THE PROCESS IS STILL THERE 12 s after it printed its last line"; echo "--- last lines of its output"; tail -n 12 hang.txt | cut -c1-160; echo "--- threads 1 to 4 (the others are parked and library threads)"; sudo gdb -p $P -batch -ex "thread apply 1 2 3 4 bt 30" -ex "thread 2" -ex "info symbol \$pc" -ex "info symbol \$x30" -ex "x/6i \$pc-12" -ex "thread 3" -ex "info symbol \$pc" -ex "info symbol \$x30" -ex "thread 4" -ex "info symbol \$pc" -ex "info symbol \$x30" -ex "info proc mappings" 2>&1 | grep -v "^\[New\|^\[Thread\|^warning\|^Reading\|^Using\|^\[Inferior" | grep -v "^  *0x[0-9a-f]* *0x[0-9a-f]* *0x[0-9a-f]* *0x[0-9a-f]* *[rwx-]*[sp]* *$" | head -150 | cut -c1-240; sudo cat /proc/$P/status | grep -E "State|Threads"; ls /proc/$P/task | wc -l; for t in /proc/$P/task/*; do echo "$(basename $t) $(cat $t/comm) $(cat $t/wchan 2>/dev/null) $(cat $t/stat | cut -d' ' -f3)"; done | head -30; kill -9 $P; else echo "ended by itself"; fi
      - name: Async pipeline creation - where it crashes and in what state
        run: |
          set +e; export WGT_BACKEND=vulkan BENCH_ASYNC_PIPELINE=1 DAWN_COSMO_INLINE_WORKERS=0 DAWN_COSMO_DIAG=1
          if [ "$(uname -m)" = aarch64 ]; then REGS="info registers x0 x1 x2 x28 sp pc"; EXTRA='p/x $tpidr' ; else REGS="info registers rax rbx rcx rdx rsp rip fs_base"; EXTRA='p/x $fs_base' ; fi
          timeout -s KILL 120 sudo -E gdb -batch -ex "handle SIGSEGV stop nopass" -ex run -ex 'p $_siginfo._sifields._sigfault.si_addr' -ex "$REGS" -ex "x/14i \$pc-48" -ex "bt 25" -ex "$EXTRA" -ex "info proc mappings" --args $DBG > gdb1.txt 2>&1
          grep -E "dawn-cosmo:|^#[0-9]+ |received signal|si_addr|^\\$|^x[0-9]+ |^rax|^rip|^pc|^sp|^fs_base|=> " gdb1.txt | cut -c1-200; PC=$(grep -E "^(rip|pc) " gdb1.txt | head -1 | awk '{print $2}'); echo "pc=$PC"; grep -B1 -A1 -i "${PC:0:9}" gdb1.txt | head -6 | cut -c1-200; awk -v p="$PC" 'BEGIN{pc=strtonum(p)} $1 ~ /^0x/ && $2 ~ /^0x/ {s=strtonum($1); e=strtonum($2); if (pc>=s && pc<e) print "mapping holding pc:", $0}' gdb1.txt
