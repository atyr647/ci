name: dawn-thread-diag
# The Cosmopolitan Dawn build crashes when the driver is called from a thread the C library created (the whole benchmark in a thread, or Dawn's async pipeline creation on its worker threads), on every OS.
# This prints the crash report (fault address, registers) and tries variants: bigger thread stack, trampolined calls on arm64.
on:
  workflow_dispatch:
    inputs:
      cosmo_run: { description: 'dawn-cosmo run with artifact wgt-dawn', required: true }
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,   os: ubuntu-latest }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - name: Dependencies and the files (the linker's .dbg ELF carries the symbols)
        run: |
          sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 gdb
          gh run download ${{ inputs.cosmo_run }} -R ${{ github.repository }} -n dbg-dawn-bench -D d && chmod +x d/*; gh run download ${{ inputs.cosmo_run }} -R ${{ github.repository }} -n wgt-dawn -D c
          A=$(uname -m); echo "DBG=$PWD/d/dawn-bench.$A.com.dbg" >> $GITHUB_ENV; ls -la d
      - name: Async pipeline creation - where it crashes and in what state
        run: |
          set +e; export WGT_BACKEND=vulkan BENCH_ASYNC_PIPELINE=1
          if [ "$(uname -m)" = aarch64 ]; then REGS="info registers x0 x1 x2 x28 sp pc"; else REGS="info registers rax rbx rcx rdx rsp rip fs_base"; fi
          timeout -s KILL 120 sudo -E gdb -batch -ex "handle SIGSEGV stop nopass" -ex run -ex 'p $_siginfo._sifields._sigfault.si_addr' -ex "$REGS" -ex "x/6i \$pc" -ex "info proc mappings" --args $DBG > gdb1.txt 2>&1
          grep -E "received signal|si_addr|^\\$|^x28|^rax|^rip|^pc|^sp|^fs_base|=> " gdb1.txt | cut -c1-200; PC=$(grep -E "^(rip|pc) " gdb1.txt | head -1 | awk '{print $2}'); echo "pc=$PC"; grep -B1 -A1 -i "${PC:0:9}" gdb1.txt | head -6 | cut -c1-200; awk -v p="$PC" 'BEGIN{pc=strtonum(p)} $1 ~ /^0x/ && $2 ~ /^0x/ {s=strtonum($1); e=strtonum($2); if (pc>=s && pc<e) print "mapping holding pc:", $0}' gdb1.txt
      - name: The benchmark on a created thread - does the process end by itself, run as the real file
        run: |
          set +e; export WGT_BACKEND=vulkan BENCH_IN_THREAD=1
          chmod +x c/dawn-bench.com 2>/dev/null; for i in 1 2 3; do timeout -s KILL 60 sh ./c/dawn-bench.com > out.$i.txt 2>&1; echo "run $i exit $? ; last line: $(tail -n 1 out.$i.txt | cut -c1-120)"; done
