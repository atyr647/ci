name: dawn-bench
# Dawn compiled by Cosmopolitan (ONE fat file) against native Dawn (platform toolchain) on the same machine: same source (ci-webgpu-test/dawn_bench.cpp), same backend,
# same adapter, runs interleaved. The CI runners have no GPU, so this measures the CPU side (Dawn, Tint, allocator, mutexes, C library, call overhead) and the software
# adapter's kernel; on a machine with a real GPU the same job measures the GPU path.
on:
  workflow_dispatch:
    inputs:
      cosmo_run: { description: 'run id of a dawn-cosmo run whose artifact wgt-dawn contains dawn-bench.com', required: true }
      cosmo_run_b: { description: 'optional second dawn-cosmo run (for example the GCC build against the clang build): its dawn-bench.com is run as the variant cosmo-b', required: false, default: '' }
      only: { description: 'one label (linux-x64, linux-arm64, win-x64, win-arm64, mac-arm64); empty = all', required: false, default: '' }
      rounds: { description: 'interleaved rounds', required: false, default: '7' }
env:
  DAWN_SHA: 106704a9ac3fc21b1580ea85aea302ac17d416f1
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { matrix: '${{ steps.m.outputs.matrix }}' }
    steps:
      - id: m
        env: { ONLY: '${{ inputs.only }}' }
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          all_ = [
            dict(label='linux-x64',   os='ubuntu-latest',    msvc='',      backend='vulkan'),
            dict(label='linux-arm64', os='ubuntu-24.04-arm', msvc='',      backend='vulkan'),
            dict(label='win-x64',     os='windows-latest',   msvc='x64',   backend='d3d12'),
            dict(label='win-arm64',   os='windows-11-arm',   msvc='arm64', backend='d3d12'),
            dict(label='mac-arm64',   os='macos-latest',     msvc='',      backend='metal'),
          ]
          only = os.environ.get('ONLY', '')
          print('matrix=' + json.dumps({'include': [x for x in all_ if not only or x['label'] == only]}))
          PY
  bench:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults: { run: { shell: bash } }
    env:
      GH_TOKEN: ${{ github.token }}
      RUNNER_LABEL: ${{ matrix.label }}
      BENCH_TINT_CURVE: ${{ startsWith(matrix.label, 'linux') && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.msvc != ''
        with: { arch: '${{ matrix.msvc }}' }
      - name: Dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ninja-build clang mesa-vulkan-drivers libvulkan1; fi
          command -v ninja >/dev/null || { brew install ninja || pip install --break-system-packages ninja || pip install ninja; }
      - name: Restore native Dawn (static library, headers, CMake package)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: dawn-native-static-${{ matrix.label }}-${{ env.DAWN_SHA }}-v1
      - name: Fetch, configure and build native Dawn (only when not cached)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir dawn && cd dawn && git init -q && git remote add origin https://github.com/google/dawn.git && git fetch -q --depth 1 origin $DAWN_SHA && git checkout -q FETCH_HEAD && cd ..
          case "${{ matrix.label }}" in
            win-*) BACKENDS="-DDAWN_ENABLE_D3D12=ON -DDAWN_ENABLE_D3D11=OFF -DDAWN_ENABLE_VULKAN=OFF -DDAWN_ENABLE_METAL=OFF" ;;
            mac-*) BACKENDS="-DDAWN_ENABLE_METAL=ON -DDAWN_ENABLE_VULKAN=OFF" ;;
            *)     BACKENDS="-DDAWN_ENABLE_VULKAN=ON -DDAWN_ENABLE_D3D12=OFF -DDAWN_ENABLE_D3D11=OFF -DDAWN_ENABLE_METAL=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" ;;
          esac
          cmake -S dawn -B out -G Ninja -DCMAKE_BUILD_TYPE=Release -DDAWN_FETCH_DEPENDENCIES=ON -DDAWN_BUILD_MONOLITHIC_LIBRARY=STATIC -DDAWN_ENABLE_INSTALL=ON \
            -DDAWN_BUILD_SAMPLES=OFF -DDAWN_BUILD_TESTS=OFF -DDAWN_BUILD_BENCHMARKS=OFF -DTINT_BUILD_TESTS=OFF -DTINT_BUILD_CMD_TOOLS=OFF -DDAWN_ENABLE_DESKTOP_GL=OFF -DDAWN_ENABLE_OPENGLES=OFF \
            -DDAWN_USE_X11=OFF -DDAWN_USE_WAYLAND=OFF -DDAWN_USE_GLFW=OFF -DDAWN_ENABLE_NULL=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DDAWN_SUPPORTS_CXX_MODULES=OFF $BACKENDS
          cmake --build out
          cmake --install out --prefix "$PWD/dist"
          find dist -name '*webgpu_dawn*' -exec ls -la {} \;
      - name: Save native Dawn
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist
          key: dawn-native-static-${{ matrix.label }}-${{ env.DAWN_SHA }}-v1
      - name: Build the benchmark against native Dawn
        run: |
          cmake -S ci-webgpu-test/bench -B benchout -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/dist" $( [ "$RUNNER_OS" = Linux ] && echo -DCMAKE_CXX_COMPILER=clang++ )
          cmake --build benchout
          mkdir native && cp benchout/dawn-bench* native/
          # native Dawn on Windows loads the FXC shader compiler only from the executable's own directory ("DynamicLib.Open: d3dcompiler_47.dll Windows Error: 87" otherwise); the Cosmopolitan build uses the normal search path
          if [ "$RUNNER_OS" = Windows ]; then cp /c/Windows/System32/d3dcompiler_47.dll native/ || cp "$SYSTEMROOT/System32/d3dcompiler_47.dll" native/; fi
          ls -la native
      - name: The Cosmopolitan build (artifact of the dawn-cosmo run)
        run: |
          gh run download ${{ inputs.cosmo_run }} -R ${{ github.repository }} -n wgt-dawn -D cosmo
          chmod +x cosmo/dawn-bench.com cosmo/dawn-bench-mf.com cosmo/dawn-bench-lib.com cosmo/dawn-bench-nomi.com; if [ "$RUNNER_OS" = Windows ]; then cp cosmo/dawn-bench.com cosmo/dawn-bench.exe; cp cosmo/dawn-bench-nomi.com cosmo/dawn-bench-nomi.exe; cp cosmo/dawn-bench-mf.com cosmo/dawn-bench-mf.exe; cp cosmo/dawn-bench-lib.com cosmo/dawn-bench-lib.exe; fi; ls -la cosmo
      - name: The second Cosmopolitan build (optional)
        if: inputs.cosmo_run_b != ''
        run: |
          gh run download ${{ inputs.cosmo_run_b }} -R ${{ github.repository }} -n wgt-dawn -D cosmob
          chmod +x cosmob/dawn-bench.com; if [ "$RUNNER_OS" = Windows ]; then cp cosmob/dawn-bench.com cosmob/dawn-bench.exe; fi
      - name: The unstripped single-architecture ELF of the same build (Linux; the file itself is started through the APE loader)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          gh run download ${{ inputs.cosmo_run }} -R ${{ github.repository }} -n dbg-dawn-bench -D dbgelf && chmod +x dbgelf/*; ls -la dbgelf
      - name: Vulkan loader + MoltenVK (macOS, for the extra Cosmopolitan-on-Vulkan row)
        if: runner.os == 'macOS'
        run: |
          brew install molten-vk vulkan-loader >/dev/null 2>&1 || true
          echo "MVK_ICD=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          echo "VKLIB=$(brew --prefix vulkan-loader)/lib" >> "$GITHUB_ENV"
      - name: Run (interleaved; the repeated native row is the noise floor)
        run: |
          B=${{ matrix.backend }}; R=${{ inputs.rounds }}
          if [ "$RUNNER_OS" = Windows ]; then NATIVE=./native/dawn-bench.exe; COSMO=./cosmo/dawn-bench.exe; COSMO_MF=./cosmo/dawn-bench-mf.exe; COSMO_LIB=./cosmo/dawn-bench-lib.exe
          else NATIVE=./native/dawn-bench; COSMO="sh ./cosmo/dawn-bench.com"; COSMO_MF="sh ./cosmo/dawn-bench-mf.com"; COSMO_LIB="sh ./cosmo/dawn-bench-lib.com"; fi
          NATIVE_TC=${NATIVE/dawn-bench/dawn-bench-tcache}
          args=(--timeout 90 --rounds "$R" --title "${{ matrix.label }}: native Dawn vs Dawn compiled by Cosmopolitan ($B)" --json "bench-${{ matrix.label }}.json"
                --variant "native|WGT_BACKEND=$B|$NATIVE" --variant "cosmo|WGT_BACKEND=$B|$COSMO" --variant "native-again|WGT_BACKEND=$B|$NATIVE"
                --variant "native-tcache|WGT_BACKEND=$B|$NATIVE_TC" --variant "cosmo-mutexfast|WGT_BACKEND=$B|$COSMO_MF" --variant "cosmo-librarymutex|WGT_BACKEND=$B|$COSMO_LIB")
          args+=(--variant "native-async|WGT_BACKEND=$B,BENCH_ASYNC_PIPELINE=1|$NATIVE" --variant "cosmo-async|WGT_BACKEND=$B,BENCH_ASYNC_PIPELINE=1|$COSMO")   # pipeline creation on Dawn's worker threads
          args+=(--variant "cosmo-async-inline|WGT_BACKEND=$B,BENCH_ASYNC_PIPELINE=1,DAWN_COSMO_INLINE_WORKERS=1|$COSMO" --variant "cosmo-async-threads|WGT_BACKEND=$B,BENCH_ASYNC_PIPELINE=1,DAWN_COSMO_INLINE_WORKERS=0|$COSMO")   # worker tasks on the posting thread / on Dawn's worker threads
          args+=(--variant "cosmo-mf-async-threads|WGT_BACKEND=$B,BENCH_ASYNC_PIPELINE=1,DAWN_COSMO_INLINE_WORKERS=0|$COSMO_MF" --variant "cosmo-lib-async-threads|WGT_BACKEND=$B,BENCH_ASYNC_PIPELINE=1,DAWN_COSMO_INLINE_WORKERS=0|$COSMO_LIB")   # does the crash depend on the lock implementation
          if [ -n "${{ inputs.cosmo_run_b }}" ]; then if [ "$RUNNER_OS" = Windows ]; then CB=./cosmob/dawn-bench.exe; else CB="sh ./cosmob/dawn-bench.com"; fi; args+=(--variant "cosmo-b|WGT_BACKEND=$B|$CB"); fi
          if [ "$RUNNER_OS" = Linux ] && [ -f dbgelf/dawn-bench.$(uname -m).com.dbg ]; then args+=(--variant "cosmo-elf|WGT_BACKEND=$B|./dbgelf/dawn-bench.$(uname -m).com.dbg"); fi   # the same code started directly as an ELF, without the APE loader
          args+=(--variant "native-tintonly|WGT_BACKEND=$B,BENCH_TINT_REPEAT=200|$NATIVE" --variant "cosmo-tintonly|WGT_BACKEND=$B,BENCH_TINT_REPEAT=200|$COSMO")   # only start-up and 200 shader-module compiles (the mode the profiles use)
          if [ "$RUNNER_OS" = Linux ]; then args+=(--variant "cosmo-nomallopt|WGT_BACKEND=$B,DAWN_COSMO_MMAP_THRESHOLD_MB=0|$COSMO"); fi   # control: glibc keeps its default mmap threshold (the shipped build raises it the way glibc itself would have adapted it natively)
          args+=(--variant "native-nobase|WGT_BACKEND=$B,BENCH_NO_BASELINES=1|$NATIVE" --variant "cosmo-nobase|WGT_BACKEND=$B,BENCH_NO_BASELINES=1|$COSMO")   # the same without the host baselines before Dawn starts
          args+=(--variant "cosmo-mi-nopurge|WGT_BACKEND=$B,MIMALLOC_PURGE_DELAY=-1|$COSMO")   # mimalloc never returns freed memory to the system (its default returns it after 10 ms; decommit calls are expensive on macOS)
          args+=(--variant "cosmo-library-malloc|WGT_BACKEND=$B|${COSMO/dawn-bench./dawn-bench-nomi.}")   # control: the library's own malloc instead of mimalloc
          if [ "$RUNNER_OS" = Linux ]; then args+=(--variant "native-sepheap|WGT_BACKEND=$B|${NATIVE/dawn-bench/dawn-bench-sepheap}"); fi   # native build with Dawn's allocations on a heap separate from the driver's
          if [ "$RUNNER_OS" = Linux ]; then args+=(--variant "cosmo-mallopt|WGT_BACKEND=$B,BENCH_MALLOPT=64|$COSMO"); fi   # the allocator keeps freed memory (no trim, no unmapping of large blocks), 64 MiB growth steps
          if [ "$RUNNER_OS" = Linux ]; then args+=(--variant "cosmo-nopool|WGT_BACKEND=$B,DAWN_COSMO_POOL=0|$COSMO"); fi   # no parked thread blocks (about 150 fewer memory mappings); only the main thread can call the driver then
          args+=(--variant "cosmo-thread|WGT_BACKEND=$B,BENCH_IN_THREAD=1|$COSMO")   # the same file with the whole benchmark on a thread the C library created, not the main thread
          if [ "${{ matrix.label }}" = win-arm64 ]; then   # the file starts its native arm64 build there: the existing cosmo rows keep measuring the emulated x86-64 half (WN_NO_NATIVE=1), one extra row is the native launch
            for i in "${!args[@]}"; do case "${args[$i]}" in *"|$COSMO") args[$i]="${args[$i]/|WGT_BACKEND=/|WN_NO_NATIVE=1,WGT_BACKEND=}";; esac; done
            args+=(--variant "cosmo-native-launch|WGT_BACKEND=$B,WN_NO_NATIVE=|$COSMO")
          fi
          if [ "${{ matrix.label }}" = linux-arm64 ]; then args+=(--variant "cosmo-tramp|WGT_BACKEND=$B,DAWN_COSMO_DIRECT=0|$COSMO"); fi
          if [ "$RUNNER_OS" = macOS ]; then
            args+=(--variant "cosmo-moltenvk|WGT_BACKEND=vulkan,BENCH_SCALE=0.1,DAWN_COSMO_ALLOW_VULKAN=1,VK_ICD_FILENAMES=$MVK_ICD,DYLD_LIBRARY_PATH=$VKLIB|$COSMO")
            args+=(--variant "cosmo-moltenvk-library-malloc|WGT_BACKEND=vulkan,BENCH_SCALE=0.1,DAWN_COSMO_ALLOW_VULKAN=1,VK_ICD_FILENAMES=$MVK_ICD,DYLD_LIBRARY_PATH=$VKLIB|${COSMO/dawn-bench./dawn-bench-nomi.}")   # the same with the library's malloc: the MoltenVK row now times out with mimalloc
          fi
          PY=$(command -v python3 || command -v python); echo "python: $PY"; "$PY" ci-webgpu-test/bench_ab.py "${args[@]}" 2>&1 | tee bench-out.txt; rc=${PIPESTATUS[0]}
          # the GPU kernel check lines (groups, time, error against the CPU reference) are not metrics, so show them separately
          for v in "$NATIVE" "$COSMO"; do echo "--- $v"; WGT_BACKEND=$B $v 2>&1 | grep -E "^gpu_alu" | tee -a bench-out.txt; done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'bench-${{ matrix.label }}', path: 'bench-*.json' }
      - name: Result (printed last, so a short log tail shows it)
        if: always()
        run: tail -n 60 bench-out.txt 2>/dev/null || echo "no bench output was produced (an earlier step failed)"
