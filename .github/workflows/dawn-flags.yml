name: dawn-flags
# Which part of the remaining gap between Dawn built by Cosmopolitan and native Dawn is the compiler or its default flags? The Cosmopolitan cross driver adds, to every compile:
# -fno-omit-frame-pointer (last on the command line, so it wins), -fpatchable-function-entry=18,16 (x86-64) / 7,6 (arm64) (16 bytes of NOPs before every function), -ffixed-x18 -ffixed-x28 (arm64),
# -mno-red-zone and -mno-tls-direct-seg-refs (x86-64), -fno-inline-functions-called-once (GCC). The Tint-only profile shows Keccak (a leaf function with very high register pressure) and one hash-map
# insert taking far more time than natively. Variants, each built from the same patched Dawn sources, benchmarked against the default GCC build and native Dawn:
#   gcc-flags : GCC with -fomit-frame-pointer (leaf functions lose the frame pointer, tail calls on), -fpatchable-function-entry=0, -finline-functions-called-once
#   clang     : cosmocc's clang with the same default flags and the same overrides
on:
  workflow_dispatch:
    inputs:
      gcc_run: { description: 'run id of a dawn-cosmo run (artifact dbg-dawn-bench = the GCC-built benchmark, single-architecture ELFs)', required: true }
      rounds: { description: 'interleaved rounds', required: false, default: '7' }
env:
  DAWN_SHA: 106704a9ac3fc21b1580ea85aea302ac17d416f1
  COSMOCC: 4.0.2
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        variant: [gcc-flags, clang]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env: { COSMO_ARCH: '${{ matrix.arch }}', VARIANT: '${{ matrix.variant }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          curl -fsSL -o cosmocc.zip https://github.com/jart/cosmopolitan/releases/download/$COSMOCC/cosmocc-$COSMOCC.zip
          mkdir -p $HOME/cosmo && unzip -q cosmocc.zip -d $HOME/cosmo
          cp $HOME/cosmo/bin/ape-x86_64.elf $HOME/.ape-1.10 && chmod +x $HOME/.ape-1.10
      - name: Restore the Dawn checkout and build directory
        uses: actions/cache/restore@v4
        with:
          path: |
            dawn
            build
          key: dawn-flags-${{ matrix.variant }}-${{ matrix.arch }}-${{ env.DAWN_SHA }}-v1-${{ github.run_id }}
          restore-keys: dawn-flags-${{ matrix.variant }}-${{ matrix.arch }}-${{ env.DAWN_SHA }}-v1-
      - name: Fetch Dawn at the pinned commit (unless restored)
        run: |
          if [ ! -d dawn/.git ]; then
            mkdir -p dawn && cd dawn && git init -q && git remote add origin https://github.com/google/dawn.git
            git fetch -q --depth 1 origin $DAWN_SHA && git checkout -q FETCH_HEAD
          fi
      - name: Patch Dawn (Vulkan backend only)
        env: { DAWN_COSMO_D3D12: '0', DAWN_COSMO_METAL: '0' }
        run: |
          python3 dawn-cosmo/keep_mtimes.py save dawn $RUNNER_TEMP/mtimes.json
          git -C dawn checkout -q -- .
          python3 dawn-cosmo/patch.py dawn
          python3 dawn-cosmo/keep_mtimes.py restore dawn $RUNNER_TEMP/mtimes.json
      - name: Configure
        run: |
          OVR="-fomit-frame-pointer -fpatchable-function-entry=0"
          if [ "$VARIANT" = clang ]; then
            printf '#!/bin/sh\nexec sh %s/dawn-cosmo/clang-wrap.sh %s cc "$@"\n' "$PWD" "$COSMO_ARCH" > $HOME/wrap-cc; printf '#!/bin/sh\nexec sh %s/dawn-cosmo/clang-wrap.sh %s c++ "$@"\n' "$PWD" "$COSMO_ARCH" > $HOME/wrap-cxx
            chmod +x $HOME/wrap-cc $HOME/wrap-cxx; export DAWN_COSMO_CC=$HOME/wrap-cc DAWN_COSMO_CXX=$HOME/wrap-cxx
          else OVR="$OVR -finline-functions-called-once"; fi
          emu=""; [ "$COSMO_ARCH" = x86_64 ] && emu="-DCMAKE_CROSSCOMPILING_EMULATOR=$HOME/.ape-1.10"
          cmake -S dawn -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PWD/dawn-cosmo/cosmo.cmake -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_FLAGS=$OVR" "-DCMAKE_CXX_FLAGS=$OVR" \
            -DDAWN_FETCH_DEPENDENCIES=ON -DDAWN_ENABLE_VULKAN=ON -DDAWN_ENABLE_D3D12=OFF -DDAWN_ENABLE_D3D11=OFF -DDAWN_ENABLE_METAL=OFF \
            -DDAWN_ENABLE_DESKTOP_GL=OFF -DDAWN_ENABLE_OPENGLES=OFF -DDAWN_ENABLE_NULL=ON -DDAWN_USE_X11=OFF -DDAWN_USE_WAYLAND=OFF -DDAWN_USE_GLFW=OFF \
            -DDAWN_BUILD_SAMPLES=OFF -DDAWN_BUILD_TESTS=OFF -DDAWN_BUILD_BENCHMARKS=OFF -DTINT_BUILD_TESTS=OFF -DTINT_BUILD_CMD_TOOLS=OFF \
            -DDAWN_BUILD_MONOLITHIC_LIBRARY=STATIC -DDAWN_ENABLE_INSTALL=OFF -DDAWN_BUILD_PROTOBUF=OFF $emu 2>&1 | tee configure.log | tail -15
          grep -m2 -E "wrap-cxx|fomit-frame-pointer" build/build.ninja | cut -c1-260 || true; test -f build/build.ninja
      - name: Build libwebgpu_dawn.a
        run: |
          cmake --build build --target webgpu_dawn -- -k 0 > build.log 2>&1 || true
          echo '=== failed objects'; grep 'FAILED:' build.log | cut -c1-200 | head -20
          echo '=== distinct errors'; grep -E 'error:|undefined reference' build.log | sed -E 's#/home/runner/work/ci/ci/dawn/##' | cut -c1-230 | sort | uniq -c | sort -rn | head -20
          tail -3 build.log
          test -n "$(find build -name libwebgpu_dawn.a)"
          ! grep -q '^FAILED:' build.log
      - name: Save the Dawn checkout and build directory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dawn
            build
          key: dawn-flags-${{ matrix.variant }}-${{ matrix.arch }}-${{ env.DAWN_SHA }}-v1-${{ github.run_id }}
      - name: Link the benchmark (single-architecture ELF, same flags as the GCC build's link)
        run: |
          B=$HOME/cosmo/bin; A=$COSMO_ARCH; L=$PWD/dist; mkdir -p dist/inc1 dist/inc2
          cp "$(find build -name libwebgpu_dawn.a | head -1)" dist/ && cp -r dawn/include/. dist/inc1/ && cp -r build/gen/include/. dist/inc2/
          INC="-I$L/inc1 -I$L/inc2 -I$PWD/ci-webgpu-test"
          $B/$A-unknown-cosmo-c++ -O2 -std=c++17 -c alloc-probe/tcache_new.cpp -o tcache_new.o
          $B/$A-unknown-cosmo-c++ -O2 -std=c++17 $INC -c ci-webgpu-test/dawn_bench.cpp -o dawn_bench.o
          $B/$A-unknown-cosmo-c++ -O2 dawn_bench.o tcache_new.o "$L/libwebgpu_dawn.a" -Wl,--wrap=pthread_create -o dawn-bench-$VARIANT.$A.com
          ls -la dawn-bench-$VARIANT.$A.com*
      - uses: actions/upload-artifact@v4
        with: { name: 'bench-${{ matrix.variant }}-${{ matrix.arch }}', path: 'dawn-bench-${{ matrix.variant }}.${{ matrix.arch }}.com.dbg' }
  run:
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64,   os: ubuntu-latest,    arch: x86_64 }
          - { label: linux-arm64, os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    env: { GH_TOKEN: '${{ github.token }}', WGT_BACKEND: vulkan }
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang mesa-vulkan-drivers libvulkan1
      - name: Native Dawn (cache written by the dawn-bench workflow) and benchmark
        uses: actions/cache/restore@v4
        with:
          path: dist
          key: dawn-native-static-${{ matrix.label }}-${{ env.DAWN_SHA }}-v1
          fail-on-cache-miss: true
      - name: Build the native benchmark
        run: |
          cmake -S ci-webgpu-test/bench -B benchout -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/dist" -DCMAKE_CXX_COMPILER=clang++
          cmake --build benchout
      - name: The two Cosmopolitan builds
        run: |
          mkdir cosmo
          gh run download ${{ inputs.gcc_run }} -R ${{ github.repository }} -n dbg-dawn-bench -D cosmo
          for v in gcc-flags clang; do gh run download $GITHUB_RUN_ID -R ${{ github.repository }} -n bench-$v-${{ matrix.arch }} -D cosmo || echo "no $v build"; done
          chmod +x cosmo/*; ls -la cosmo
      - name: Run (interleaved)
        run: |
          N=./benchout/dawn-bench; G=./cosmo/dawn-bench.${{ matrix.arch }}.com.dbg; F=./cosmo/dawn-bench-gcc-flags.${{ matrix.arch }}.com.dbg; C=./cosmo/dawn-bench-clang.${{ matrix.arch }}.com.dbg
          python3 ci-webgpu-test/bench_ab.py --rounds ${{ inputs.rounds }} --title "${{ matrix.label }}: native vs Cosmopolitan default GCC build vs GCC without frame pointers / NOP padding vs clang" --json bench-clang-${{ matrix.label }}.json \
            --variant "native|WGT_BACKEND=vulkan|$N" --variant "cosmo-gcc|WGT_BACKEND=vulkan|$G" --variant "cosmo-gcc-flags|WGT_BACKEND=vulkan|$F" $( [ -f ${C#./} ] && echo --variant "cosmo-clang|WGT_BACKEND=vulkan|$C" ) --variant "native-again|WGT_BACKEND=vulkan|$N" 2>&1 | tee bench-out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'bench-flags-result-${{ matrix.label }}', path: 'bench-*.json' }
      - name: Result (last)
        if: always()
        run: tail -n 40 bench-out.txt 2>/dev/null || echo "no output"
